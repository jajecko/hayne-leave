name: verify-pr-absence-policy-balance-mode

on:
  pull_request:

jobs:
  verify-absence-policy-balance-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source guardrails
        run: |
          set -eux
          model=hayne/overlay/legacy/application/models/Hayne_credit_exemption_model.php
          grep -Fq "getPolicyForType" "$model"
          grep -Fq "balance_mode" "$model"
          grep -Fq "BALANCE_MODE_REQUIRES_CREDIT = 'BALANCE'" "$model"
          grep -Fq "BALANCE_MODES_CREDIT_EXEMPT = ['NONE', 'GRANT']" "$model"
          grep -Fq 'return $this->isOfficialSummonsType($leaveTypeId);' "$model"
          grep -Fq "Unknown HAYNE balance_mode" "$model"
          ! grep -Fq '$leaveTypeId === 15' "$model"
          ! grep -Fq '$leaveTypeId == 15' "$model"

      - name: Verify registry map and credit adapter semantics
        run: |
          php <<'PHP'
          <?php
          define('BASEPATH', __DIR__);
          class CI_Model {}
          function log_message($level, $message): void {}

          require 'hayne/overlay/legacy/application/models/Hayne_leave_type_registry_model.php';
          require 'hayne/overlay/legacy/application/models/Hayne_credit_exemption_model.php';

          final class FakeRegistry
          {
              public array $policies;

              public function __construct(array $policies)
              {
                  $this->policies = $policies;
              }

              public function getPolicyForType(int $leaveTypeId): ?array
              {
                  return $this->policies[$leaveTypeId] ?? NULL;
              }
          }

          final class TestCreditAdapter extends Hayne_credit_exemption_model
          {
              public $hayne_leave_type_registry_model;

              public function __construct() {}

              public function isOfficialSummonsType(int $leaveTypeId): bool
              {
                  return $leaveTypeId === 999;
              }
          }

          $policies = Hayne_leave_type_registry_model::mvpPolicies();
          if (count($policies) !== 20) {
              fwrite(STDERR, "Expected 20 registry policies\n");
              exit(1);
          }

          $balanceIds = [];
          $noneCount = 0;
          $grantCount = 0;
          $activeLeaveCount = 0;
          $activeLeaveCreditExemptCount = 0;

          foreach ($policies as $id => $policy) {
              $mode = $policy['balance_mode'];
              if ($mode === 'BALANCE') {
                  $balanceIds[] = (int) $id;
              } elseif ($mode === 'NONE') {
                  $noneCount++;
              } elseif ($mode === 'GRANT') {
                  $grantCount++;
              } else {
                  fwrite(STDERR, "Unexpected bootstrap balance mode: {$mode}\n");
                  exit(1);
              }

              if ((int) $policy['enabled'] === 1 && (int) $policy['active_for_new_requests'] === 1 && $policy['domain'] === 'LEAVE') {
                  $activeLeaveCount++;
                  if ($mode !== 'BALANCE') {
                      $activeLeaveCreditExemptCount++;
                  }
              }
          }

          if ($balanceIds !== [1, 8, 9, 12] || $noneCount !== 15 || $grantCount !== 1) {
              fwrite(STDERR, "Unexpected balance-mode distribution\n");
              exit(1);
          }
          if ($activeLeaveCount !== 16 || $activeLeaveCreditExemptCount !== 12) {
              fwrite(STDERR, "Unexpected active LEAVE credit distribution\n");
              exit(1);
          }

          $adapter = new TestCreditAdapter();
          $adapter->hayne_leave_type_registry_model = new FakeRegistry($policies);
          foreach ($policies as $id => $policy) {
              $expected = $policy['balance_mode'] !== 'BALANCE';
              if ($adapter->isCreditExemptType((int) $id) !== $expected) {
                  fwrite(STDERR, "Credit policy mismatch for type {$id}\n");
                  exit(1);
              }
          }

          $disabled = $policies;
          $disabled[3]['enabled'] = 0;
          $adapter->hayne_leave_type_registry_model = new FakeRegistry($disabled);
          if ($adapter->isCreditExemptType(3) !== false) {
              fwrite(STDERR, "Disabled registry row must fail closed\n");
              exit(1);
          }

          $unknown = $policies;
          $unknown[3]['balance_mode'] = 'FUTURE_MODE';
          $adapter->hayne_leave_type_registry_model = new FakeRegistry($unknown);
          if ($adapter->isCreditExemptType(3) !== false) {
              fwrite(STDERR, "Unknown balance mode must fail closed\n");
              exit(1);
          }

          $adapter->hayne_leave_type_registry_model = new FakeRegistry([]);
          if ($adapter->isCreditExemptType(999) !== true || $adapter->isCreditExemptType(998) !== false) {
              fwrite(STDERR, "Legacy no-registry-row fallback mismatch\n");
              exit(1);
          }

          echo "ABSENCE-POLICY-03 adapter semantics PASS\n";
          PHP

      - name: Verify cumulative overlay and patch stack
        env:
          JORANI_VERSION: v1.0.4
        run: |
          rm -rf /tmp/hayne-final-source
          mkdir -p /tmp/hayne-final-source
          curl -fsSL "https://github.com/jorani/jorani/archive/refs/tags/${JORANI_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/hayne-final-source
          cp -a hayne/overlay/. /tmp/hayne-final-source/
          cd /tmp/hayne-final-source
          for patch_file in "$GITHUB_WORKSPACE"/hayne/patches/*.patch; do
            rel="${patch_file#${GITHUB_WORKSPACE}/}"
            echo "Applying ${rel}"
            if ! patch_output=$(patch --batch --forward -p1 < "$patch_file" 2>&1); then
              patch_output=$(printf "%s" "$patch_output" | tr "\n" " ")
              echo "::error file=${rel}::${patch_output}"
              exit 1
            fi
          done

      - name: Verify final runtime integration
        run: |
          set -eux
          controller=/tmp/hayne-final-source/legacy/application/controllers/Leaves.php
          adapter=/tmp/hayne-final-source/legacy/application/models/Hayne_credit_exemption_model.php
          registry=/tmp/hayne-final-source/legacy/application/models/Hayne_leave_type_registry_model.php
          php -l "$controller"
          php -l "$adapter"
          php -l "$registry"
          test "$(grep -Fc 'isCreditExemptType((int) $leaveTypeId)' "$controller")" -eq 2
          test "$(grep -Fc 'isCreditExemptType($leaveTypeId)' "$controller")" -eq 1
          grep -Fq 'creditExempt' "$controller"
          grep -Fq 'getPolicyForType' "$adapter"
          grep -Fq 'return $this->isOfficialSummonsType($leaveTypeId);' "$adapter"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify built runtime PHP syntax
        run: |
          docker compose run --rm --no-deps jorani sh -ec '
            php -l legacy/application/models/Hayne_credit_exemption_model.php
            php -l legacy/application/models/Hayne_leave_type_registry_model.php
            php -l legacy/application/controllers/Leaves.php
            grep -Fq "getPolicyForType" legacy/application/models/Hayne_credit_exemption_model.php
            grep -Fq "creditExempt" legacy/application/controllers/Leaves.php
          '

      - name: Show logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose logs --no-color || true
          fi
