name: debug-pr-leave-06

on:
  pull_request:
    paths:
      - '.github/workflows/debug-pr-leave-06.yml'
      - 'hayne/overlay/legacy/application/models/Hayne_childcare_model.php'
      - 'hayne/overlay/legacy/application/controllers/Haynelimits.php'
      - 'hayne/patches/230-childcare-controller-base.patch'
      - 'hayne/patches/231-childcare-create.patch'

jobs:
  same-day-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/session/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Authenticate and configure one Art. 188 day
        run: |
          mkdir -p artifacts
          curl -fsS -c artifacts/cookies.txt http://localhost:8080/session/login -o artifacts/login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            http://localhost:8080/session/login \
            -o artifacts/home.html

          curl -fsS -b artifacts/cookies.txt http://localhost:8080/haynelimits -o artifacts/limits.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/limits.html | head -n 1)"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'childcare_type_id=3' \
            --data-urlencode 'childcare_enabled=1' \
            http://localhost:8080/haynelimits/saveChildcarePolicy \
            -o artifacts/policy.html

          year="$(date +%Y)"
          curl -fsS -b artifacts/cookies.txt "http://localhost:8080/haynelimits?year=${year}" -o artifacts/limits-year.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/limits-year.html | head -n 1)"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'employee_id=1' \
            --data-urlencode "year=${year}" \
            --data-urlencode 'childcare_days=1' \
            http://localhost:8080/haynelimits/saveChildcareAllocation \
            -o artifacts/allocation.html

      - name: Submit same-day Art. 188 request and collect evidence
        shell: bash
        run: |
          set -u
          today="$(date +%F)"
          curl -fsS -b artifacts/cookies.txt http://localhost:8080/leaves/create -o artifacts/form.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/form.html | head -n 1)"
          test -n "$csrf_token"

          set +e
          curl -sS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode "startdate=${today}" \
            --data-urlencode 'startdatetype=Morning' \
            --data-urlencode "enddate=${today}" \
            --data-urlencode 'enddatetype=Afternoon' \
            --data-urlencode 'duration=1' \
            --data-urlencode 'type=3' \
            --data-urlencode 'cause=CI CHILDCARE SAME DAY DEBUG' \
            --data-urlencode 'status=2' \
            http://localhost:8080/leaves/create \
            -o artifacts/same-day.html
          echo "$?" > artifacts/curl-rc.txt
          set -e

          docker compose exec -T mysql sh -ec "
            mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -e \"SELECT id,startdate,enddate,status,employee,cause,duration,type,startdatetype,enddatetype FROM leaves ORDER BY id; SELECT * FROM hayne_childcare_year_allocations ORDER BY employee_id,year; SELECT id,employee,startdate,enddate,days,type,description FROM entitleddays WHERE employee=1 ORDER BY id; SELECT id,name,acronym,deduct_days_off FROM types ORDER BY id; SELECT id,name,startentdate,endentdate FROM contracts ORDER BY id; SELECT id,contract,date,type,length FROM dayoffs WHERE contract=1 AND date='${today}' ORDER BY id;\"
          " > artifacts/db-state.txt 2>&1 || true
          docker compose logs --no-color jorani > artifacts/app.log 2>&1 || true
          grep -n -E 'alert|opieki|Opieki|limit|Limit|Nie uda|błęd|Błęd|error|Error|duration|Duration|credit|Credit' artifacts/same-day.html > artifacts/response-signals.txt || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-leave-06-same-day-diagnostic
          path: artifacts/
          if-no-files-found: error
          retention-days: 2

      - name: Tear down
        if: always()
        run: docker compose down -v
