name: verify-pr-canceled-overlap

on:
  pull_request:
    paths:
      - 'hayne/patches/260-canceled-leave-overlap.patch'
      - '.github/workflows/verify-pr-canceled-overlap.yml'
      - 'docs/checkpoints/PR-LEAVE-08_CANCELED_OVERLAP.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/patches/260-canceled-leave-overlap.patch'
      - '.github/workflows/verify-pr-canceled-overlap.yml'
      - 'docs/checkpoints/PR-LEAVE-08_CANCELED_OVERLAP.md'

jobs:
  canceled-overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Guard overlap policy source
        run: |
          grep -F "where_not_in('status', [LMS_REJECTED, LMS_CANCELED])" hayne/patches/260-canceled-leave-overlap.patch
          ! grep -F "where('status != 4')" hayne/patches/260-canceled-leave-overlap.patch

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build patched application image
        run: docker compose build jorani

      - name: Lint patched model
        run: docker compose run --rm --no-deps jorani php -l /var/www/html/legacy/application/models/Leaves_model.php

      - name: Verify built overlap policy
        run: |
          docker compose run --rm --no-deps jorani grep -F "where_not_in('status', [LMS_REJECTED, LMS_CANCELED])" /var/www/html/legacy/application/models/Leaves_model.php
          docker compose run --rm --no-deps jorani sh -ec "! grep -F \"where('status != 4')\" /var/www/html/legacy/application/models/Leaves_model.php"

      - name: Tear down
        if: always()
        run: docker compose down -v
