name: verify-pr-leave-types-01

on:
  pull_request:
    paths:
      - 'hayne/patches/160-types-model-zero-id.patch'
      - 'hayne/patches/170-leave-types-no-compensate.patch'
      - '.env.example'
      - '.github/workflows/verify-pr-leave-types-01.yml'
      - 'docs/checkpoints/PR-LEAVE-TYPES-01_NO_COMPENSATE.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/patches/160-types-model-zero-id.patch'
      - 'hayne/patches/170-leave-types-no-compensate.patch'
      - '.env.example'
      - '.github/workflows/verify-pr-leave-types-01.yml'
      - 'docs/checkpoints/PR-LEAVE-TYPES-01_NO_COMPENSATE.md'

jobs:
  leave-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Guard leave type sources
        run: |
          grep -F "default_leave_type'] = \$env_int('DEFAULT_LEAVE_TYPE', 1)" hayne/patches/170-leave-types-no-compensate.patch
          grep -F "overtime_compensation_type'] = \$env_int('OVERTIME_COMPENSATION_TYPE', 0)" hayne/patches/170-leave-types-no-compensate.patch
          grep -F "array_key_first(\$types)" hayne/patches/170-leave-types-no-compensate.patch
          grep -F "'type' => \$compensationType" hayne/patches/170-leave-types-no-compensate.patch
          ! grep -F "+'type' => 0" hayne/patches/170-leave-types-no-compensate.patch
          grep -F 'DEFAULT_LEAVE_TYPE=1' .env.example
          grep -F 'DISABLE_OVERTIME=TRUE' .env.example

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Guard patched runtime
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "\$config['\''default_leave_type'\''] = \$env_int('\''DEFAULT_LEAVE_TYPE'\'', 1);" legacy/application/config/config.php
            grep -F "array_key_first(\$types)" legacy/application/models/Contracts_model.php
            grep -F "'\''type'\'' => \$compensationType" legacy/application/models/Overtime_model.php
            ! grep -F "'\''type'\'' => 0" legacy/application/models/Overtime_model.php
          '

      - name: Prepare HAYNE leave type fixture
        run: |
          docker compose exec -T mysql sh -ec '
            mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -e "
              DELETE FROM leaves;
              DELETE FROM entitleddays;
              DELETE FROM excluded_types;
              DELETE FROM overtime;
              DELETE FROM types;
              INSERT INTO types (id, name, acronym, deduct_days_off) VALUES
                (1, '\''urlop wypoczynkowy'\'', '\''UW'\'', 1),
                (2, '\''urlop na zadanie'\'', '\''UZ'\'', 1),
                (3, '\''urlop bezplatny'\'', '\''UB'\'', 0);
              ALTER TABLE types AUTO_INCREMENT = 4;
              UPDATE contracts SET default_leave_type = 1 WHERE id = 1;
              UPDATE users SET role = 9, language = '\''pl'\'', contract = 1 WHERE login = '\''jorani'\'';
            "
          '

          docker compose exec -T mysql sh -ec '
            mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" \
              -Nse "SELECT CONCAT(MIN(id), '\''-'\'', MAX(id), '\'';'\'', COUNT(*)) FROM types; SELECT default_leave_type FROM contracts WHERE id=1;"
          ' | tee /tmp/leave-type-fixture.txt
          grep -F '1-3;3' /tmp/leave-type-fixture.txt
          grep -Fx '1' /tmp/leave-type-fixture.txt

      - name: Login as Polish admin
        run: |
          mkdir -p artifacts/leave-types
          for attempt in $(seq 1 60); do
            if curl -fsS \
              -c artifacts/leave-types/cookies.txt \
              http://localhost:8080/session/login \
              -o artifacts/leave-types/login.html; then
              break
            fi
            echo "Waiting for HAYNE Leave (${attempt}/60)..."
            sleep 2
          done

          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/leave-types/login.html | head -n 1)"
          test -n "$csrf_token"

          curl -fsS -L \
            -c artifacts/leave-types/cookies.txt \
            -b artifacts/leave-types/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=pl' \
            http://localhost:8080/session/login \
            -o artifacts/leave-types/home.html

      - name: Verify create leave with HAYNE IDs
        run: |
          curl -fsS -L \
            -b artifacts/leave-types/cookies.txt \
            -c artifacts/leave-types/cookies.txt \
            http://localhost:8080/leaves/create \
            -o artifacts/leave-types/create-default-1.html

          page=artifacts/leave-types/create-default-1.html
          ! grep -Eqi 'A PHP Error was encountered|Undefined array key|TypeError|Severity:[[:space:]]*(Warning|Notice|Deprecated)' "$page"
          grep -F 'option value="1" selected' "$page"
          grep -F 'urlop wypoczynkowy' "$page"
          ! grep -F '>compensate<' "$page"

      - name: Verify stale default ID falls back safely
        run: |
          docker compose exec -T mysql sh -ec '
            mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" \
              -e "UPDATE contracts SET default_leave_type = 999 WHERE id = 1;"
          '

          curl -fsS -L \
            -b artifacts/leave-types/cookies.txt \
            -c artifacts/leave-types/cookies.txt \
            http://localhost:8080/leaves/create \
            -o artifacts/leave-types/create-stale-default.html

          page=artifacts/leave-types/create-stale-default.html
          ! grep -Eqi 'A PHP Error was encountered|Undefined array key|TypeError|Severity:[[:space:]]*(Warning|Notice|Deprecated)' "$page"
          grep -F 'option value="1" selected' "$page"
          grep -F 'urlop wypoczynkowy' "$page"

      - name: Upload leave type evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-leave-types-01-evidence
          path: artifacts/leave-types/
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
