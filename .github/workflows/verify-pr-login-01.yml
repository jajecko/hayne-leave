name: verify-pr-login-01

on:
  pull_request:
    paths:
      - 'hayne/overlay/assets/hayne/logo.svg'
      - 'hayne/overlay/assets/hayne/login.css'
      - 'hayne/overlay/assets/hayne/login.js'
      - 'hayne/patches/020-menu-branding.patch'
      - 'hayne/patches/030-login-branding.patch'
      - 'hayne/patches/040-oauth-login-branding.patch'
      - 'hayne/patches/050-session-failure-branding.patch'
      - 'hayne/patches/060-oauth-authorize-branding.patch'
      - '.github/workflows/verify-pr-login-01.yml'
      - 'docs/checkpoints/PR-LOGIN-01_CENTERED_LOGIN_BRAND_LOCKUP.md'
      - 'docs/checkpoints/PR-LOGO-01_HAYNE_LEAVE_LOCKUP.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/overlay/assets/hayne/logo.svg'
      - 'hayne/overlay/assets/hayne/login.css'
      - 'hayne/overlay/assets/hayne/login.js'
      - 'hayne/patches/020-menu-branding.patch'
      - 'hayne/patches/030-login-branding.patch'
      - 'hayne/patches/040-oauth-login-branding.patch'
      - 'hayne/patches/050-session-failure-branding.patch'
      - 'hayne/patches/060-oauth-authorize-branding.patch'
      - '.github/workflows/verify-pr-login-01.yml'
      - 'docs/checkpoints/PR-LOGIN-01_CENTERED_LOGIN_BRAND_LOCKUP.md'
      - 'docs/checkpoints/PR-LOGO-01_HAYNE_LEAVE_LOCKUP.md'

jobs:
  login-brand-lockup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Guard unified logo source
        run: |
          grep -F 'viewBox="0 0 1304 343"' hayne/overlay/assets/hayne/logo.svg
          grep -F '<title id="title">HAYNE LEAVE</title>' hayne/overlay/assets/hayne/logo.svg
          grep -F 'HAYNE wordmark with LEAVE centered between horizontal rules.' hayne/overlay/assets/hayne/logo.svg
          grep -F 'fill-rule="evenodd"' hayne/overlay/assets/hayne/logo.svg
          ! grep -F '<text' hayne/overlay/assets/hayne/logo.svg
          ! grep -F '<image' hayne/overlay/assets/hayne/logo.svg
          grep -F "target-v2" hayne/overlay/assets/hayne/login.js
          ! grep -F 'makeLeaveSubmark' hayne/overlay/assets/hayne/login.js
          ! grep -F "textContent = 'HAYNE Leave'" hayne/overlay/assets/hayne/login.js
          grep -F 'width: min(440px, 100%);' hayne/overlay/assets/hayne/login.css
          grep -F 'width: min(204px, 72%);' hayne/overlay/assets/hayne/login.css

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Download pinned Jorani source
        env:
          JORANI_VERSION: v1.0.4
        run: |
          mkdir -p /tmp/jorani
          curl -fsSL "https://github.com/jorani/jorani/archive/refs/tags/${JORANI_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/jorani

      - name: Verify HAYNE patches independently
        run: |
          cd /tmp/jorani
          for patch_file in "$GITHUB_WORKSPACE"/hayne/patches/*.patch; do
            echo "Checking ${patch_file}"
            patch --dry-run --batch --forward -p1 < "${patch_file}"
          done

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Guard branded source in built image
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "assets/hayne/logo.svg" legacy/application/views/menu/index.php
            grep -F "assets/hayne/logo.svg" legacy/application/views/session/login.php
            grep -F "assets/hayne/logo.svg" legacy/application/views/session/failure.php
            grep -F "assets/hayne/logo.svg" legacy/application/views/session/login_simple.php
            grep -F "assets/hayne/logo.svg" legacy/application/views/session/authorize.php
            grep -F "viewBox=\"0 0 1304 343\"" assets/hayne/logo.svg
            ! grep -F "<text" assets/hayne/logo.svg
            ! grep -F "<image" assets/hayne/logo.svg
            ! grep -F "hayne-navbar-product" legacy/application/views/menu/index.php
            ! grep -F "hayne-login-product-name" legacy/application/views/session/login.php
            ! grep -F "hayne-login-product-name" legacy/application/views/session/failure.php
            ! grep -F "hayne-login-lockup-sub" assets/hayne/login.js
            grep -F "target-v2" assets/hayne/login.js
          '

      - name: Wait for login
        run: |
          mkdir -p artifacts
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/session/login -o artifacts/hayne-login.html; then
              break
            fi
            echo "Waiting for login (${attempt}/60)..."
            sleep 2
          done
          test -s artifacts/hayne-login.html
          test "$(grep -o 'assets/hayne/logo.svg' artifacts/hayne-login.html | wc -l)" -eq 1
          ! grep -F 'hayne-login-product-name' artifacts/hayne-login.html
          ! grep -F 'jorani.org' artifacts/hayne-login.html

      - name: Render login DOM and screenshots
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "google-chrome is required for PR-LOGIN-01 render verification"
            exit 1
          fi

          chrome_flags="--headless --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=2500"

          google-chrome $chrome_flags \
            --window-size=1440,1000 \
            --dump-dom \
            http://127.0.0.1:8080/session/login \
            > artifacts/hayne-login-rendered.html

          grep -F 'data-hayne-login="target-v2"' artifacts/hayne-login-rendered.html
          grep -F 'Zaloguj się, aby zarządzać urlopami i nieobecnościami.' artifacts/hayne-login-rendered.html
          ! grep -F 'hayne-login-product-name' artifacts/hayne-login-rendered.html
          ! grep -F 'hayne-login-lockup-sub' artifacts/hayne-login-rendered.html

          google-chrome $chrome_flags \
            --window-size=1440,1000 \
            --screenshot=artifacts/hayne-login-desktop.png \
            http://127.0.0.1:8080/session/login

          google-chrome $chrome_flags \
            --window-size=390,844 \
            --screenshot=artifacts/hayne-login-mobile.png \
            http://127.0.0.1:8080/session/login

      - name: Upload logo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-logo-01-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
