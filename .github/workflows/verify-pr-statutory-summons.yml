name: verify-pr-statutory-summons

on:
  pull_request:

jobs:
  verify-statutory-summons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check hayne/overlay/assets/hayne/official-summons.js

      - name: Verify source guardrails
        run: |
          grep -F "POLICY_CODE_OFFICIAL_SUMMONS = 'official_summons'" hayne/overlay/legacy/application/models/Hayne_credit_exemption_model.php
          grep -F "runtime code never" hayne/overlay/legacy/application/models/Hayne_credit_exemption_model.php
          grep -F "isCreditExemptType" hayne/patches/279-official-summons-credit-exemption.patch
          grep -F "creditExempt" hayne/patches/279-official-summons-credit-exemption.patch
          grep -F "saveOfficialSummonsPolicy" hayne/overlay/legacy/application/controllers/Haynelimits.php
          grep -F "official_summons_policy" hayne/overlay/legacy/application/views/haynelimits/index.php
          grep -F "HAYNE nie rozpoznaje go po nazwie ani nie zgaduje jego ID" hayne/overlay/legacy/application/views/haynelimits/official_summons.php
          grep -F "official-summons.js?v=1" hayne/patches/281-official-summons-assets.patch
          test ! -e hayne/patches/280-official-summons-admin.patch

      - name: Verify cumulative overlay and patch stack
        env:
          JORANI_VERSION: v1.0.4
        run: |
          rm -rf /tmp/hayne-final-source
          mkdir -p /tmp/hayne-final-source
          curl -fsSL "https://github.com/jorani/jorani/archive/refs/tags/${JORANI_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/hayne-final-source
          cp -a hayne/overlay/. /tmp/hayne-final-source/
          cd /tmp/hayne-final-source
          for patch_file in "$GITHUB_WORKSPACE"/hayne/patches/*.patch; do
            rel="${patch_file#${GITHUB_WORKSPACE}/}"
            echo "Applying ${rel}"
            if ! patch_output=$(patch --batch --forward -p1 < "$patch_file" 2>&1); then
              patch_output=$(printf "%s" "$patch_output" | tr "\n" " ")
              echo "::error file=${rel}::${patch_output}"
              exit 1
            fi
          done

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify final runtime guardrails
        run: |
          docker compose run --rm --no-deps jorani sh -ec '
            test -s assets/hayne/official-summons.js
            test -s legacy/application/models/Hayne_credit_exemption_model.php
            test -s legacy/application/views/haynelimits/official_summons.php
            grep -F "assets/hayne/official-summons.js?v=1" legacy/application/views/templates/header.php
            test "$(grep -c "isCreditExemptType((int) \$leaveTypeId)" legacy/application/controllers/Leaves.php)" -eq 2
            grep -F "creditExempt" legacy/application/controllers/Leaves.php
            grep -F "saveOfficialSummonsPolicy" legacy/application/controllers/Haynelimits.php
            grep -F "official_summons_policy" legacy/application/views/haynelimits/index.php
          '

      - name: Verify final runtime PHP syntax
        run: |
          docker compose run --rm --no-deps jorani sh -ec '
            for file in \
              legacy/application/models/Hayne_credit_exemption_model.php \
              legacy/application/controllers/Leaves.php \
              legacy/application/controllers/Haynelimits.php \
              legacy/application/views/haynelimits/official_summons.php \
              legacy/application/views/haynelimits/index.php; do
              if ! lint_output=$(php -l "$file" 2>&1); then
                lint_output=$(printf "%s" "$lint_output" | tr "\n" " ")
                echo "::error file=$file::$lint_output"
                exit 1
              fi
            done
          '

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
