name: verify-pr-review-login-regressions

on:
  pull_request:
    paths:
      - 'hayne/patches/286-ui-mail-branding-hotfix.patch'
      - 'hayne/patches/287-review-login-regression-hotfix.patch'
      - '.github/workflows/verify-pr-review-login-regressions.yml'
      - '.github/workflows/verify-pr-ui-mail-branding-hotfix.yml'
      - 'docs/checkpoints/PR-REGRESSION-01_REVIEW_LOGIN_MAIL.md'

jobs:
  verify-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source contract
        run: |
          set -eux
          PATCH286=hayne/patches/286-ui-mail-branding-hotfix.patch
          PATCH287=hayne/patches/287-review-login-regression-hotfix.patch

          test -s "$PATCH286"
          test -s "$PATCH287"

          grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png')" "$PATCH286"
          ! grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png', 'image/png')" "$PATCH286"

          grep -F "\$data['requests'] = [];" "$PATCH287"
          test "$(grep -Fc '(array) $this->leaves_model->getLeavesRequestedToManager' "$PATCH287")" -eq 2
          grep -F "fetch_class() === 'session'" "$PATCH287"
          grep -F "fetch_method() === 'login'" "$PATCH287"
          grep -F 'class="hayne-login-target"' "$PATCH287"

      - name: Download pinned Jorani source
        env:
          JORANI_VERSION: v1.0.4
        run: |
          set -eux
          rm -rf /tmp/jorani-pristine /tmp/hayne-final-source
          mkdir -p /tmp/jorani-pristine /tmp/hayne-final-source
          curl -fsSL "https://github.com/jorani/jorani/archive/refs/tags/${JORANI_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/jorani-pristine
          cp -a /tmp/jorani-pristine/. /tmp/hayne-final-source/

      - name: Verify patch 287 independently
        run: |
          set -eux
          cd /tmp/jorani-pristine
          patch --dry-run --batch --forward -p1 < "$GITHUB_WORKSPACE/hayne/patches/287-review-login-regression-hotfix.patch"

      - name: Verify cumulative overlay and patch stack
        run: |
          set -eux
          cp -a hayne/overlay/. /tmp/hayne-final-source/
          cd /tmp/hayne-final-source
          for patch_file in "$GITHUB_WORKSPACE"/hayne/patches/*.patch; do
            rel="${patch_file#${GITHUB_WORKSPACE}/}"
            echo "Applying ${rel}"
            if ! patch_output=$(patch --batch --forward -p1 < "$patch_file" 2>&1); then
              patch_output=$(printf "%s" "$patch_output" | tr "\n" " ")
              echo "::error file=${rel}::${patch_output}"
              exit 1
            fi
          done

      - name: Lint final regression targets
        run: |
          set -eux
          php -l /tmp/hayne-final-source/legacy/application/controllers/Requests.php
          php -l /tmp/hayne-final-source/legacy/application/views/templates/header.php
          php -l /tmp/hayne-final-source/legacy/application/helpers/tools_helper.php

      - name: Verify Requests array normalization before workflow merge
        run: |
          set -eux
          FILE=/tmp/hayne-final-source/legacy/application/controllers/Requests.php

          grep -Fq "\$data['requests'] = [];" "$FILE"
          test "$(grep -Fc '(array) $this->leaves_model->getLeavesRequestedToManager' "$FILE")" -eq 2
          grep -Fq 'filterAndMergeApproverRequests(' "$FILE"

          INIT_LINE="$(grep -nF "\$data['requests'] = [];" "$FILE" | head -1 | cut -d: -f1)"
          MERGE_LINE="$(grep -nF 'filterAndMergeApproverRequests(' "$FILE" | head -1 | cut -d: -f1)"

          echo "REQUESTS_INIT_LINE=$INIT_LINE"
          echo "WORKFLOW_MERGE_LINE=$MERGE_LINE"

          test "$INIT_LINE" -lt "$MERGE_LINE"

      - name: Verify server-first login class
        run: |
          set -eux
          FILE=/tmp/hayne-final-source/legacy/application/views/templates/header.php
          grep -Fq "fetch_class() === 'session'" "$FILE"
          grep -Fq "fetch_method() === 'login'" "$FILE"
          grep -Fq 'class="hayne-login-target"' "$FILE"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start final HAYNE Leave image
        run: docker compose up --build -d

      - name: Verify built runtime regression targets
        run: |
          set -eux
          docker compose exec -T jorani sh -ec '
            php -l /var/www/html/legacy/application/controllers/Requests.php
            php -l /var/www/html/legacy/application/views/templates/header.php
            php -l /var/www/html/legacy/application/helpers/tools_helper.php
            grep -Fq "$data['"'"'requests'"'"'] = [];" /var/www/html/legacy/application/controllers/Requests.php
            test "$(grep -Fc "(array) \$this->leaves_model->getLeavesRequestedToManager" /var/www/html/legacy/application/controllers/Requests.php)" -eq 2
            grep -Fq "fetch_class() === '"'"'session'"'"'" /var/www/html/legacy/application/views/templates/header.php
            grep -Fq "fetch_method() === '"'"'login'"'"'" /var/www/html/legacy/application/views/templates/header.php
            grep -Fq "attach(\$mailLogoPath, '"'"'inline'"'"', '"'"'hayne-logo.png'"'"')" /var/www/html/legacy/application/helpers/tools_helper.php
          '

      - name: Verify raw login HTML is targeted before client enhancement
        run: |
          set -eux
          mkdir -p artifacts
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/session/login -o artifacts/login-raw.html; then
              break
            fi
            echo "Waiting for login (${attempt}/60)..."
            sleep 2
          done

          test -s artifacts/login-raw.html
          grep -F '<body class="hayne-login-target">' artifacts/login-raw.html
          grep -F 'hayne-login-shell' artifacts/login-raw.html

      - name: Verify real PNG payload through native CI_Email
        run: |
          set -eux
          docker compose exec -T jorani php -n <<'PHP'
          <?php
          define('BASEPATH', '/var/www/html/legacy/system/');

          function &get_mimes()
          {
              static $mimes = ['png' => 'image/png'];
              return $mimes;
          }

          require BASEPATH . 'libraries/Email.php';

          $reflection = new ReflectionClass('CI_Email');
          $email = $reflection->newInstanceWithoutConstructor();
          $path = '/var/www/html/assets/hayne/logo.png';

          if ($email->attach($path, 'inline', 'hayne-logo.png') === false) exit(10);
          $cid = $email->attachment_cid($path);
          if (!is_string($cid) || $cid === '') exit(11);

          $property = $reflection->getProperty('_attachments');
          $property->setAccessible(true);
          $attachments = $property->getValue($email);
          if (!is_array($attachments) || count($attachments) !== 1) exit(12);

          $attachment = $attachments[0];
          $payload = base64_decode(preg_replace('/\s+/', '', $attachment['content']), true);
          if (!is_string($payload)) exit(13);

          $sourceSha = hash_file('sha256', $path);
          $payloadSha = hash('sha256', $payload);
          echo "SOURCE_LOGO_SHA={$sourceSha}\n";
          echo "MIME_LOGO_SHA={$payloadSha}\n";
          if ($sourceSha !== $payloadSha) exit(14);
          if (($attachment['type'] ?? '') !== 'image/png') exit(15);
          if (($attachment['multipart'] ?? '') !== 'related') exit(16);
          if (($attachment['cid'] ?? '') !== $cid) exit(17);

          echo "MAIL_MIME_PAYLOAD_GATE=PASS\n";
          PHP

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-login-mail-regression-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down -v
