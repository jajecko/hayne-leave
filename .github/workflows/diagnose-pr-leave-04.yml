name: diagnose-pr-leave-04

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-pr-leave-04.yml'
      - 'hayne/patches/*.patch'
      - 'hayne/overlay/**'

jobs:
  final-controller-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE image
        run: docker compose build jorani

      - name: Lint final Leaves controller with diagnostics
        run: |
          docker compose run --rm --no-deps jorani sh -ec '
            if php -l legacy/application/controllers/Leaves.php; then
              exit 0
            fi
            echo "=== FINAL Leaves.php lines 325-410 ==="
            nl -ba legacy/application/controllers/Leaves.php | sed -n "325,410p"
            echo "=== END DIAGNOSTIC ==="
            exit 1
          '
