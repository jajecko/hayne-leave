name: verify-pr-mail-logo-outlook-dimensions

on:
  pull_request:
    paths:
      - 'hayne/patches/286-ui-mail-branding-hotfix.patch'
      - '.github/workflows/verify-pr-mail-logo-outlook-dimensions.yml'
      - 'docs/checkpoints/PR83_MAIL_LOGO_OUTLOOK_DIMENSIONS.md'

jobs:
  verify-mail-logo-dimensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source contract
        run: |
          set -eux
          PATCH=hayne/patches/286-ui-mail-branding-hotfix.patch
          test -s "$PATCH"
          grep -F "dirname(FCPATH) . DIRECTORY_SEPARATOR . 'assets/hayne/logo.png'" "$PATCH"
          grep -F '$mailLogoWidth = 180;' "$PATCH"
          grep -F '$mailLogoHeight = 25;' "$PATCH"
          grep -F '@getimagesize($mailLogoPath)' "$PATCH"
          grep -F 'width="'"'"' . $mailLogoWidth . '"'"'"' height="'"'"' . $mailLogoHeight . '"'"'"'' "$PATCH"
          grep -F 'height:'"'"' . $mailLogoHeight . '"'"'px' "$PATCH"
          ! grep -Fq 'height:auto' "$PATCH"

      - name: Verify patch 286 independently
        run: |
          set -eux
          rm -rf /tmp/jorani
          mkdir -p /tmp/jorani
          curl -fsSL https://github.com/jorani/jorani/archive/refs/tags/v1.0.4.tar.gz \
            | tar -xz --strip-components=1 -C /tmp/jorani
          cd /tmp/jorani
          patch --dry-run --batch --forward -p1 \
            < "$GITHUB_WORKSPACE/hayne/patches/286-ui-mail-branding-hotfix.patch"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify final runtime contract
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint sh jorani -ec '
            TOOLS=/var/www/html/legacy/application/helpers/tools_helper.php
            php -n -l "$TOOLS"
            grep -Fq "\$mailLogoWidth = 180;" "$TOOLS"
            grep -Fq "\$mailLogoHeight = 25;" "$TOOLS"
            grep -Fq "@getimagesize(\$mailLogoPath)" "$TOOLS"
            grep -Fq "width=\"'\'' . \$mailLogoWidth . '\''\" height=\"'\'' . \$mailLogoHeight . '\''\"" "$TOOLS"
            if grep -Fq "height:auto" "$TOOLS"; then
              echo "legacy auto-height mail logo styling still present"
              exit 31
            fi
          '

      - name: Verify source image geometry and calculated target size
        run: |
          set -eux
          docker compose run --rm --no-deps -T --entrypoint php jorani -n <<'PHP'
          <?php
          $path = '/var/www/html/assets/hayne/logo.png';
          $size = getimagesize($path);
          if (!is_array($size)) {
              fwrite(STDERR, "getimagesize failed\n");
              exit(40);
          }
          echo "SOURCE_WIDTH={$size[0]}\n";
          echo "SOURCE_HEIGHT={$size[1]}\n";
          if ((int) $size[0] !== 1669 || (int) $size[1] !== 234) {
              fwrite(STDERR, "unexpected source logo geometry\n");
              exit(41);
          }
          $targetWidth = 180;
          $targetHeight = max(1, (int) round($targetWidth * $size[1] / $size[0]));
          echo "TARGET_WIDTH={$targetWidth}\n";
          echo "TARGET_HEIGHT={$targetHeight}\n";
          if ($targetHeight !== 25) {
              fwrite(STDERR, "unexpected target height\n");
              exit(42);
          }
          echo "MAIL_LOGO_GEOMETRY_GATE=PASS\n";
          PHP

      - name: Verify PHPMailer related MIME with explicit logo dimensions
        run: |
          set -eux
          docker compose run --rm --no-deps -T --entrypoint php jorani -n <<'PHP'
          <?php
          define('BASEPATH', '/var/www/html/legacy/system/');
          define('FCPATH', '/var/www/html/legacy/');
          defined('FOPEN_READ') || define('FOPEN_READ', 'rb');

          function &get_mimes()
          {
              static $mimes = ['png' => 'image/png'];
              return $mimes;
          }

          require '/var/www/html/legacy/vendor/autoload.php';
          require BASEPATH . 'libraries/Email.php';
          require '/var/www/html/legacy/application/libraries/MY_Email.php';

          $reflection = new ReflectionClass('MY_Email');
          $email = $reflection->newInstanceWithoutConstructor();
          $engine = $reflection->getProperty('mailer_engine');
          $engine->setValue($email, 'phpmailer');
          $email->phpmailer = new PHPMailer\PHPMailer\PHPMailer(true);

          $path = dirname(FCPATH) . DIRECTORY_SEPARATOR . 'assets/hayne/logo.png';
          $size = getimagesize($path);
          $targetWidth = 180;
          $targetHeight = max(1, (int) round($targetWidth * $size[1] / $size[0]));

          $email->attach($path, 'inline', 'hayne-logo.png', '', true);
          $cid = $email->get_attachment_cid($path);
          if (!is_string($cid) || $cid === '') {
              fwrite(STDERR, "CID missing\n");
              exit(50);
          }

          $mail = $email->phpmailer;
          $mail->setFrom('urlopy@hayne.pl', 'HAYNE Leave');
          $mail->addAddress('smoke@example.invalid');
          $mail->Subject = 'HAYNE Leave Outlook geometry smoke';
          $mail->isHTML(true);
          $mail->Body = '<html><body><img src="cid:'
              . htmlspecialchars($cid, ENT_QUOTES, 'UTF-8')
              . '" alt="HAYNE Leave" width="' . $targetWidth . '" height="' . $targetHeight . '"'
              . ' style="display:block;width:' . $targetWidth . 'px;height:' . $targetHeight . 'px;max-width:' . $targetWidth . 'px;border:0;outline:none;text-decoration:none;">'
              . '</body></html>';
          $mail->AltBody = 'HAYNE Leave';

          if (!$mail->preSend()) {
              fwrite(STDERR, "preSend failed\n");
              exit(51);
          }

          $mime = $mail->getSentMIMEMessage();
          $normalizedMime = preg_replace('/\s+/', '', $mime);
          $expectedBase64 = base64_encode(file_get_contents($path));
          $hasDimensions = strpos($mime, 'width="180" height="25"') !== false
              || strpos($mime, 'width=3D"180" height=3D"25"') !== false;

          $checks = [
              'multipart/related' => stripos($mime, 'multipart/related') !== false,
              'inline disposition' => stripos($mime, 'Content-Disposition: inline') !== false,
              'matching Content-ID' => strpos($mime, 'Content-ID: <' . $cid . '>') !== false,
              'matching HTML CID' => strpos($mime, 'cid:' . $cid) !== false,
              'explicit 180x25 dimensions' => $hasDimensions,
              'real PNG bytes' => strpos($normalizedMime, $expectedBase64) !== false,
          ];

          foreach ($checks as $name => $ok) {
              echo $name . '=' . ($ok ? 'PASS' : 'FAIL') . "\n";
              if (!$ok) exit(52);
          }

          echo "OUTLOOK_MAIL_LOGO_DIMENSIONS_GATE=PASS\n";
          PHP

      - name: Verify no unrelated scope drift
        run: |
          set -eux
          PATCH=hayne/patches/286-ui-mail-branding-hotfix.patch
          ! grep -F 'workflow_mode' "$PATCH"
          ! grep -F 'hayne_leave_type_registry' "$PATCH"
          ! grep -F 'legacy/application/controllers/Requests.php' "$PATCH"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color || true
