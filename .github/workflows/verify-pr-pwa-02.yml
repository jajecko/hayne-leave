name: verify-pr-pwa-02

on:
  pull_request:

jobs:
  web-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Verify committed icon assets
        run: |
          set -e
          for icon in \
            favicon.ico \
            favicon-16x16.png \
            favicon-32x32.png \
            apple-touch-icon.png \
            pwa-icon-192.png \
            pwa-icon-512.png \
            pwa-icon-maskable-192.png \
            pwa-icon-maskable-512.png \
            notification-badge-128.png
          do
            test -s "hayne/overlay/assets/hayne/$icon"
          done

          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path('hayne/overlay/assets/hayne')
          expected = {
              'favicon-16x16.png': (16, 16),
              'favicon-32x32.png': (32, 32),
              'apple-touch-icon.png': (180, 180),
              'pwa-icon-192.png': (192, 192),
              'pwa-icon-512.png': (512, 512),
              'pwa-icon-maskable-192.png': (192, 192),
              'pwa-icon-maskable-512.png': (512, 512),
              'notification-badge-128.png': (128, 128),
          }
          signature = b'\x89PNG\r\n\x1a\n'
          for name, dims in expected.items():
              data = (root / name).read_bytes()
              assert data[:8] == signature, f'{name}: invalid PNG signature'
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == dims, f'{name}: {(width, height)} != {dims}'

          ico = (root / 'favicon.ico').read_bytes()
          reserved, kind, count = struct.unpack('<HHH', ico[:6])
          assert (reserved, kind) == (0, 1), 'favicon.ico: invalid ICO header'
          assert count >= 2, 'favicon.ico: expected at least 16x16 and 32x32 entries'
          print('Icon source validation PASS')
          PY

      - name: Build HAYNE Leave with Web Push dependencies
        run: docker compose build jorani

      - name: Verify runtime dependencies and source
        run: |
          docker compose run --rm --no-deps jorani sh -ec '
            php -m | grep -Fx bcmath
            php -m | grep -Fx curl
            php -m | grep -Fx mbstring
            php -r "require '\''legacy/vendor/autoload.php'\''; exit(class_exists('\''Minishlink\\WebPush\\WebPush'\'') ? 0 : 1);"
            php -l legacy/application/controllers/Push.php
            php -l legacy/application/helpers/hayne_push_helper.php
            grep -F "hayne_push_send_for_mail" legacy/application/helpers/tools_helper.php
            grep -F "assets/hayne/push.css" legacy/application/views/templates/header.php
            grep -F "assets/hayne/favicon.ico" legacy/application/views/templates/header.php
            grep -F "assets/hayne/favicon-32x32.png" legacy/application/views/templates/header.php
            grep -F "assets/hayne/favicon-16x16.png" legacy/application/views/templates/header.php
            grep -F "assets/hayne/apple-touch-icon.png" legacy/application/views/templates/header.php
            test -s manifest.webmanifest
            test -s service-worker.js
            test -s assets/hayne/favicon.ico
            test -s assets/hayne/favicon-16x16.png
            test -s assets/hayne/favicon-32x32.png
            test -s assets/hayne/apple-touch-icon.png
            test -s assets/hayne/pwa-icon-192.png
            test -s assets/hayne/pwa-icon-512.png
            test -s assets/hayne/pwa-icon-maskable-192.png
            test -s assets/hayne/pwa-icon-maskable-512.png
            test -s assets/hayne/notification-badge-128.png
            grep -F "pwa-icon-192.png" manifest.webmanifest
            grep -F "pwa-icon-maskable-512.png" manifest.webmanifest
            grep -F "pwa-icon-192.png" service-worker.js
            grep -F "notification-badge-128.png" service-worker.js
            grep -F "self.addEventListener('\''push'\''" service-worker.js
            grep -F "self.addEventListener('\''notificationclick'\''" service-worker.js
            ! grep -F "self.addEventListener('\''fetch'\''" service-worker.js
            ! grep -F "caches." service-worker.js
          '

      - name: Start stack and install push schema
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/session/login >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/service-worker.js >/dev/null
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/hayne/favicon.ico >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/hayne/pwa-icon-192.png >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/hayne/pwa-icon-maskable-512.png >/dev/null
          curl -fsS http://127.0.0.1:8080/assets/hayne/notification-badge-128.png >/dev/null
          docker compose exec -T jorani php /opt/hayne/push-install.php

      - name: Verify authenticated push settings stay disabled without secrets
        run: |
          mkdir -p artifacts
          curl -fsS -c artifacts/cookies.txt http://127.0.0.1:8080/session/login -o artifacts/login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            http://127.0.0.1:8080/session/login \
            -o artifacts/home.html
          curl -fsS \
            -H 'X-Requested-With: XMLHttpRequest' \
            -b artifacts/cookies.txt \
            http://127.0.0.1:8080/push/settings \
            -o artifacts/push-settings.json
          grep -F '"enabled":false' artifacts/push-settings.json
          ! grep -F 'VAPID_PRIVATE_KEY' artifacts/push-settings.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
