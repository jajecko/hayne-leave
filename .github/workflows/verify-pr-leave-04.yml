name: verify-pr-leave-04

on:
  pull_request:
    paths:
      - 'hayne/overlay/legacy/application/models/Hayne_caregiver_leave_model.php'
      - 'hayne/overlay/legacy/application/controllers/Haynelimits.php'
      - 'hayne/overlay/legacy/application/views/haynelimits/**'
      - 'hayne/overlay/legacy/application/views/leaves/caregiver_*.php'
      - 'hayne/patches/220-caregiver-controller-base.patch'
      - 'hayne/patches/221-caregiver-create.patch'
      - 'hayne/patches/222-caregiver-edit.patch'
      - 'hayne/patches/223-caregiver-plan-transition.patch'
      - 'hayne/patches/224-caregiver-views.patch'
      - 'hayne/sql/001-leave-profiles.sql'
      - '.github/workflows/verify-pr-leave-04.yml'
      - 'docs/checkpoints/PR-LEAVE-04_CAREGIVER_LEAVE.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/overlay/legacy/application/models/Hayne_caregiver_leave_model.php'
      - 'hayne/overlay/legacy/application/controllers/Haynelimits.php'
      - 'hayne/overlay/legacy/application/views/haynelimits/**'
      - 'hayne/overlay/legacy/application/views/leaves/caregiver_*.php'
      - 'hayne/patches/220-caregiver-controller-base.patch'
      - 'hayne/patches/221-caregiver-create.patch'
      - 'hayne/patches/222-caregiver-edit.patch'
      - 'hayne/patches/223-caregiver-plan-transition.patch'
      - 'hayne/patches/224-caregiver-views.patch'
      - 'hayne/sql/001-leave-profiles.sql'
      - '.github/workflows/verify-pr-leave-04.yml'
      - 'docs/checkpoints/PR-LEAVE-04_CAREGIVER_LEAVE.md'

jobs:
  caregiver-leave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/session/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Syntax and source checks
        run: |
          docker compose exec -T jorani php -l legacy/application/models/Hayne_caregiver_leave_model.php
          docker compose exec -T jorani php -l legacy/application/controllers/Haynelimits.php
          docker compose exec -T jorani php -l legacy/application/controllers/Leaves.php
          docker compose exec -T jorani php -l legacy/application/views/leaves/caregiver_fields.php
          docker compose exec -T jorani php -l legacy/application/views/leaves/caregiver_details.php
          docker compose exec -T jorani php -l legacy/application/views/haynelimits/caregiver.php
          docker compose exec -T jorani sh -ec '
            grep -F "ANNUAL_LIMIT_DAYS = 5" legacy/application/models/Hayne_caregiver_leave_model.php
            grep -F "lockEmployeeYear" legacy/application/controllers/Leaves.php
            grep -F "caregiver_fields" legacy/application/views/leaves/create.php
            grep -F "caregiver_fields" legacy/application/views/leaves/edit.php
            grep -F "data-hayne-caregiver-summary" legacy/application/views/leaves/counters.php
            grep -F "caregiver_details" legacy/application/views/leaves/view.php
          '

      - name: Authenticate as administrator
        run: |
          mkdir -p artifacts
          curl -fsS -c artifacts/cookies.txt http://localhost:8080/session/login -o artifacts/login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            http://localhost:8080/session/login \
            -o artifacts/home.html
          grep -F 'Cześć Admin!' artifacts/home.html

      - name: Configure caregiver policy
        run: |
          curl -fsS -b artifacts/cookies.txt http://localhost:8080/haynelimits -o artifacts/limits.html
          grep -F 'Urlop opiekuńczy' artifacts/limits.html
          grep -F 'HAYNE nie zgaduje jego ID.' artifacts/limits.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/limits.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'caregiver_type_id=4' \
            --data-urlencode 'caregiver_enabled=1' \
            http://localhost:8080/haynelimits/saveCaregiverPolicy \
            -o artifacts/caregiver-policy.html
          grep -F 'Urlop opiekuńczy: zapisano limit 5 dni rocznie.' artifacts/caregiver-policy.html

          year="$(date +%Y)"
          docker compose exec -T mysql sh -ec "
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT CONCAT(leave_type_id,':',enabled) FROM hayne_statutory_leave_policies WHERE policy_code='caregiver'\")\" = \"4:1\"
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM entitleddays WHERE employee=1 AND type=4 AND days=5 AND startdate='${year}-01-01' AND enddate='${year}-12-31' AND description='[HAYNE_STATUTORY|caregiver|${year}]'\")\" = \"1\"
          "

      - name: Verify request form exposes statutory fields
        run: |
          curl -fsS -b artifacts/cookies.txt http://localhost:8080/leaves/create -o artifacts/create.html
          grep -F 'id="hayneCaregiverFields"' artifacts/create.html
          grep -F 'data-caregiver-type-id="4"' artifacts/create.html
          grep -F 'Osoba wymagająca opieki lub wsparcia' artifacts/create.html
          grep -F 'Przyczyna konieczności zapewnienia opieki lub wsparcia' artifacts/create.html
          grep -F 'pozostało <strong>5 z 5 dni</strong>' artifacts/create.html

      - name: Prepare dates and request helper
        shell: bash
        run: |
          set -euo pipefail
          base="$(date -d '+45 days' +%F)"
          if [ "$(date -d "$base" +%m)" = "12" ]; then
            next_year="$(( $(date -d "$base" +%Y) + 1 ))"
            base="${next_year}-01-10"
          fi
          {
            echo "CG_D1=$base"
            echo "CG_D3=$(date -d "$base +2 days" +%F)"
            echo "CG_D8=$(date -d "$base +7 days" +%F)"
            echo "CG_D10=$(date -d "$base +9 days" +%F)"
            echo "CG_D15=$(date -d "$base +14 days" +%F)"
            echo "CG_D16=$(date -d "$base +15 days" +%F)"
            echo "CG_D22=$(date -d "$base +21 days" +%F)"
            echo "CG_D29=$(date -d "$base +28 days" +%F)"
          } >> "$GITHUB_ENV"

          cat > artifacts/submit-caregiver.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          start="$1"
          end="$2"
          duration="$3"
          status="$4"
          cause="$5"
          person="$6"
          relation="$7"
          address="$8"
          reason="$9"
          output="${10}"

          curl -fsS -b artifacts/cookies.txt http://localhost:8080/leaves/create -o artifacts/form.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/form.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/cookies.txt \
            -b artifacts/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode "startdate=${start}" \
            --data-urlencode 'startdatetype=Morning' \
            --data-urlencode "enddate=${end}" \
            --data-urlencode 'enddatetype=Afternoon' \
            --data-urlencode "duration=${duration}" \
            --data-urlencode 'type=4' \
            --data-urlencode "cause=${cause}" \
            --data-urlencode "status=${status}" \
            --data-urlencode "hayne_caregiver_person_name=${person}" \
            --data-urlencode "hayne_caregiver_relation=${relation}" \
            --data-urlencode "hayne_caregiver_household_address=${address}" \
            --data-urlencode "hayne_caregiver_reason=${reason}" \
            http://localhost:8080/leaves/create \
            -o "$output"
          SH
          chmod +x artifacts/submit-caregiver.sh

      - name: Reject incomplete caregiver metadata
        run: |
          before="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM leaves WHERE cause='CI CAREGIVER NO ADDRESS'\"")"
          artifacts/submit-caregiver.sh "$CG_D1" "$CG_D1" 1 2 'CI CAREGIVER NO ADDRESS' 'Jan Kowalski' household '' 'Poważne względy medyczne' artifacts/no-address.html
          after="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM leaves WHERE cause='CI CAREGIVER NO ADDRESS'\"")"
          test "$before" = "$after"
          grep -F 'Podaj adres zamieszkania osoby z tego samego gospodarstwa domowego.' artifacts/no-address.html

      - name: Enforce one-day advance requirement
        run: |
          today="$(date +%F)"
          artifacts/submit-caregiver.sh "$today" "$today" 1 2 'CI CAREGIVER SAME DAY' 'Anna Kowalska' mother '' 'Poważne względy medyczne' artifacts/same-day.html
          test "$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM leaves WHERE cause='CI CAREGIVER SAME DAY'\"")" = "0"
          grep -F 'Wniosek o urlop opiekuńczy złóż co najmniej 1 dzień przed jego rozpoczęciem.' artifacts/same-day.html

      - name: Reserve first three caregiver days
        run: |
          artifacts/submit-caregiver.sh "$CG_D1" "$CG_D3" 3 2 'CI CAREGIVER THREE' 'Anna Kowalska' mother '' 'Poważne względy medyczne' artifacts/three.html
          first_id="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT id FROM leaves WHERE cause='CI CAREGIVER THREE' ORDER BY id DESC LIMIT 1\"")"
          test -n "$first_id"
          docker compose exec -T mysql sh -ec "
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT CONCAT(type,':',CAST(duration AS UNSIGNED),':',status) FROM leaves WHERE id=${first_id}\")\" = \"4:3:2\"
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT CONCAT(person_name,':',relation_code) FROM hayne_caregiver_request_meta WHERE leave_id=${first_id}\")\" = \"Anna Kowalska:mother\"
          "

      - name: Reject request exceeding remaining two days
        run: |
          artifacts/submit-caregiver.sh "$CG_D8" "$CG_D10" 3 2 'CI CAREGIVER THREE REJECT' 'Jan Kowalski' father '' 'Poważne względy medyczne' artifacts/three-reject.html
          test "$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM leaves WHERE cause='CI CAREGIVER THREE REJECT'\"")" = "0"
          grep -F 'Przekroczony limit urlopu opiekuńczego. Pozostało: 2 dni.' artifacts/three-reject.html

      - name: Reach five of five with household request
        run: |
          artifacts/submit-caregiver.sh "$CG_D15" "$CG_D16" 2 2 'CI CAREGIVER FINAL TWO' 'Piotr Nowak' household 'ul. Testowa 1, Warszawa' 'Poważne względy medyczne' artifacts/final-two.html
          final_id="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT id FROM leaves WHERE cause='CI CAREGIVER FINAL TWO' ORDER BY id DESC LIMIT 1\"")"
          test -n "$final_id"
          docker compose exec -T mysql sh -ec "
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT household_address FROM hayne_caregiver_request_meta WHERE leave_id=${final_id}\")\" = \"ul. Testowa 1, Warszawa\"
          "
          curl -fsS -b artifacts/cookies.txt http://localhost:8080/leaves/counters -o artifacts/balance.html
          grep -F 'data-hayne-caregiver-summary="v1"' artifacts/balance.html
          grep -F 'data-used="5"' artifacts/balance.html
          grep -F 'data-remaining="0"' artifacts/balance.html
          grep -F 'Pozostało: 0 dni.' artifacts/balance.html

      - name: Reject sixth caregiver day
        run: |
          artifacts/submit-caregiver.sh "$CG_D22" "$CG_D22" 1 2 'CI CAREGIVER SIXTH REJECT' 'Anna Kowalska' daughter '' 'Poważne względy medyczne' artifacts/sixth.html
          test "$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM leaves WHERE cause='CI CAREGIVER SIXTH REJECT'\"")" = "0"
          grep -F 'Przekroczony limit urlopu opiekuńczego. Pozostało: 0 dni.' artifacts/sixth.html

      - name: Planned caregiver leave must recheck limit on submission
        run: |
          artifacts/submit-caregiver.sh "$CG_D29" "$CG_D29" 1 1 'CI CAREGIVER PLAN' 'Jan Kowalski' father '' 'Poważne względy medyczne' artifacts/plan.html
          plan_id="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT id FROM leaves WHERE cause='CI CAREGIVER PLAN' ORDER BY id DESC LIMIT 1\"")"
          test -n "$plan_id"
          curl -fsS -L -b artifacts/cookies.txt -c artifacts/cookies.txt "http://localhost:8080/leaves/request/${plan_id}" -o artifacts/plan-request.html
          test "$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT status FROM leaves WHERE id=${plan_id}\"")" = "1"
          grep -F 'Przekroczony limit urlopu opiekuńczego. Pozostało: 0 dni.' artifacts/plan-request.html

      - name: Verify caregiver details and no carry-over
        run: |
          first_id="$(docker compose exec -T mysql sh -ec "mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT id FROM leaves WHERE cause='CI CAREGIVER THREE' ORDER BY id DESC LIMIT 1\"")"
          curl -fsS -b artifacts/cookies.txt "http://localhost:8080/leaves/view/${first_id}" -o artifacts/details.html
          grep -F 'data-hayne-caregiver-details="v1"' artifacts/details.html
          grep -F 'Anna Kowalska' artifacts/details.html
          grep -F 'Poważne względy medyczne' artifacts/details.html

          year="$(date +%Y)"
          next_year="$((year + 1))"
          curl -fsS -b artifacts/cookies.txt "http://localhost:8080/haynelimits?year=${next_year}" -o artifacts/limits-next.html
          docker compose exec -T mysql sh -ec "
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT CAST(days AS UNSIGNED) FROM entitleddays WHERE employee=1 AND type=4 AND description='[HAYNE_STATUTORY|caregiver|${next_year}]' AND startdate='${next_year}-01-01'\")\" = \"5\"
            test \"\$(mysql -u\"\$MYSQL_USER\" -p\"\$MYSQL_PASSWORD\" \"\$MYSQL_DATABASE\" -Nse \"SELECT COUNT(*) FROM entitleddays WHERE employee=1 AND type=4 AND description LIKE '[HAYNE\\_STATUTORY|caregiver|%'\")\" = \"2\"
          "
          curl -fsS -b artifacts/cookies.txt "http://localhost:8080/leaves/counters/${next_year}-06-15" -o artifacts/balance-next.html
          grep -F 'data-hayne-caregiver-summary="v1"' artifacts/balance-next.html
          grep -F 'data-used="0"' artifacts/balance-next.html
          grep -F 'data-remaining="5"' artifacts/balance-next.html

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
