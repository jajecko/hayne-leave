name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  branding-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Download pinned Jorani source
        env:
          JORANI_VERSION: v1.0.4
        run: |
          mkdir -p /tmp/jorani
          curl -fsSL "https://github.com/jorani/jorani/archive/refs/tags/${JORANI_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C /tmp/jorani

      - name: Verify HAYNE patches
        run: |
          cd /tmp/jorani
          for patch_file in "$GITHUB_WORKSPACE"/hayne/patches/*.patch; do
            echo "Checking ${patch_file}"
            patch --dry-run --batch --forward -p1 < "${patch_file}"
          done

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Verify PR-UI-01 source in built image
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "leave-create-v2" legacy/application/views/leaves/create.php
            grep -F "assets/hayne/request.css" legacy/application/views/templates/header.php
          '

      - name: Verify PR-UI-02 source in built image
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "my-requests-v2" legacy/application/views/leaves/index.php
            grep -F "Moje wnioski" legacy/application/views/leaves/index.php
            grep -F "assets/hayne/requests-list.css" legacy/application/views/templates/header.php
          '

      - name: Verify alternate auth branding
        run: |
          docker compose exec -T jorani sh -ec '
            for file in \
              legacy/application/views/session/login_simple.php \
              legacy/application/views/session/failure.php \
              legacy/application/views/session/authorize.php; do
              grep -F "assets/hayne/logo.svg" "$file"
              ! grep -F "assets/images/logo_simple.png" "$file"
            done
            grep -F "HAYNE Leave" legacy/application/views/session/login_simple.php
            grep -F "assets/hayne/hayne.css" legacy/application/views/session/login_simple.php
            grep -F "assets/hayne/favicon.svg" legacy/application/views/session/login_simple.php
            ! grep -F " - Jorani" legacy/application/views/session/login_simple.php
          '

      - name: Verify HAYNE mail branding
        run: |
          docker compose exec -T jorani sh -ec '
            template=legacy/application/views/emails/en/new_user.php
            config=legacy/application/config/config.php
            grep -F "Welcome to HAYNE Leave" "$template"
            ! grep -F "Welcome to Jorani" "$template"
            ! grep -F "jorani.org" "$template"
            grep -E "from_name.*HAYNE Leave" "$config"
            grep -E "subject_prefix.*HAYNE Leave" "$config"
            ! grep -E "from_name.*Jorani" "$config"
            ! grep -E "subject_prefix.*Jorani" "$config"
          '

      - name: Smoke test branded login page
        run: |
          mkdir -p artifacts
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/session/login -o artifacts/hayne-login.html; then
              break
            fi
            echo "Waiting for HAYNE Leave (${attempt}/60)..."
            sleep 2
          done
          test -s artifacts/hayne-login.html
          grep -F 'HAYNE Leave' artifacts/hayne-login.html
          grep -F 'hayne-logo--login' artifacts/hayne-login.html
          grep -F 'assets/hayne/logo.svg' artifacts/hayne-login.html
          grep -F 'assets/hayne/favicon.svg' artifacts/hayne-login.html
          grep -F 'assets/hayne/hayne.css' artifacts/hayne-login.html
          ! grep -F 'jorani.org' artifacts/hayne-login.html
          curl -fsS http://127.0.0.1:8080/assets/hayne/favicon.svg -o artifacts/hayne-favicon.svg
          grep -F '<svg' artifacts/hayne-favicon.svg

      - name: Smoke test authenticated HAYNE home
        run: |
          curl -fsS \
            -c artifacts/hayne-cookies.txt \
            http://localhost:8080/session/login \
            -o artifacts/hayne-auth-login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/hayne-auth-login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/hayne-cookies.txt \
            -b artifacts/hayne-cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            http://localhost:8080/session/login \
            -o artifacts/hayne-home.html
          test -s artifacts/hayne-home.html
          grep -F 'data-hayne-home="v1"' artifacts/hayne-home.html
          grep -F 'Time off, in one place.' artifacts/hayne-home.html
          grep -F 'assets/hayne/home.css' artifacts/hayne-home.html
          ! grep -F 'Welcome to Jorani' artifacts/hayne-home.html
          curl -fsS http://localhost:8080/assets/hayne/home.css -o artifacts/hayne-home.css
          grep -F '.hayne-home-hero' artifacts/hayne-home.css

      - name: Smoke test authenticated HAYNE surfaces
        run: |
          curl -fsS -b artifacts/hayne-cookies.txt http://localhost:8080/leaves -o artifacts/hayne-leaves.html
          curl -fsS -b artifacts/hayne-cookies.txt http://localhost:8080/leaves/counters -o artifacts/hayne-balance.html
          curl -fsS -b artifacts/hayne-cookies.txt http://localhost:8080/leaves/create -o artifacts/hayne-create-leave.html
          grep -F 'id="leaves"' artifacts/hayne-leaves.html
          grep -F 'data-hayne-view="my-requests-v2"' artifacts/hayne-leaves.html
          grep -F 'Moje wnioski' artifacts/hayne-leaves.html
          grep -F 'Rodzaj nieobecności' artifacts/hayne-leaves.html
          grep -F 'Nowy wniosek' artifacts/hayne-leaves.html
          grep -F 'table table-bordered table-hover' artifacts/hayne-balance.html
          grep -F 'id="frmLeaveForm"' artifacts/hayne-create-leave.html
          grep -F 'data-hayne-view="leave-create-v2"' artifacts/hayne-create-leave.html
          for file in artifacts/hayne-leaves.html artifacts/hayne-balance.html artifacts/hayne-create-leave.html; do
            grep -F 'assets/hayne/app.css' "$file"
            ! grep -F 'jorani.org' "$file"
          done
          grep -F 'assets/hayne/requests-list.css' artifacts/hayne-leaves.html
          curl -fsS http://localhost:8080/assets/hayne/app.css -o artifacts/hayne-app.css
          curl -fsS http://localhost:8080/assets/hayne/request.css -o artifacts/hayne-request.css
          curl -fsS http://localhost:8080/assets/hayne/requests-list.css -o artifacts/hayne-requests-list.css
          grep -F '#wrap .table' artifacts/hayne-app.css
          grep -F '#wrap input[type="text"]' artifacts/hayne-app.css
          grep -F '.hayne-request-page' artifacts/hayne-request.css
          grep -F '.hayne-request-actions' artifacts/hayne-request.css
          grep -F '.hayne-requests-page' artifacts/hayne-requests-list.css
          grep -F '.hayne-status-chip' artifacts/hayne-requests-list.css

      - name: Guard visible HAYNE white-label
        run: |
          for file in \
            artifacts/hayne-login.html \
            artifacts/hayne-home.html \
            artifacts/hayne-leaves.html \
            artifacts/hayne-balance.html \
            artifacts/hayne-create-leave.html; do
            ! grep -F 'Jorani' "$file"
            ! grep -F 'jorani.org' "$file"
          done

      - name: Capture HAYNE screenshots
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chrome_flags="--headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --run-all-compositor-stages-before-draw --window-size=1440,1000"
            google-chrome $chrome_flags \
              --screenshot=artifacts/hayne-login.png \
              http://127.0.0.1:8080/session/login
            for page in home leaves balance create-leave; do
              google-chrome $chrome_flags \
                --screenshot="artifacts/hayne-${page}.png" \
                "file://${GITHUB_WORKSPACE}/artifacts/hayne-${page}.html"
            done
          else
            echo "google-chrome is not available on this runner; HTML smoke remains authoritative."
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayne-login-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
