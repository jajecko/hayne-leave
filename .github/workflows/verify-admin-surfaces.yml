name: verify-admin-surfaces

on:
  pull_request:
    paths:
      - 'hayne/overlay/assets/hayne/legacy-compat.css'
      - 'hayne/patches/010-header-branding.patch'
      - 'hayne/patches/160-types-model-zero-id.patch'
      - '.github/workflows/verify-admin-surfaces.yml'
      - 'docs/checkpoints/PR-ADMIN-01_LEGACY_COMPAT.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/overlay/assets/hayne/legacy-compat.css'
      - 'hayne/patches/010-header-branding.patch'
      - 'hayne/patches/160-types-model-zero-id.patch'
      - '.github/workflows/verify-admin-surfaces.yml'
      - 'docs/checkpoints/PR-ADMIN-01_LEGACY_COMPAT.md'

jobs:
  admin-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Guard compatibility sources
        run: |
          test -f hayne/overlay/assets/hayne/legacy-compat.css
          test -f hayne/patches/160-types-model-zero-id.patch
          grep -F 'assets/hayne/legacy-compat.css' hayne/patches/010-header-branding.patch
          grep -F 'public function getTypes(?int $id = null): ?array' hayne/patches/160-types-model-zero-id.patch
          grep -F 'if ($id === null)' hayne/patches/160-types-model-zero-id.patch
          grep -F '#wrap .form-horizontal .control-group' hayne/overlay/assets/hayne/legacy-compat.css
          grep -F '#wrap .btn-group' hayne/overlay/assets/hayne/legacy-compat.css
          grep -F '#wrap .input-append' hayne/overlay/assets/hayne/legacy-compat.css

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Guard compatibility files in built image
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "assets/hayne/legacy-compat.css" legacy/application/views/templates/header.php
            grep -F "public function getTypes(?int \$id = null): ?array" legacy/application/models/Types_model.php
            grep -F "if (\$id === null)" legacy/application/models/Types_model.php
            test -f assets/hayne/legacy-compat.css
          '

      - name: Promote fixture user to admin and HR
        run: |
          docker compose exec -T mysql sh -ec '
            mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" \
              -e "UPDATE users SET role = 9 WHERE login = '\''jorani'\'';"
          '

      - name: Login as Polish admin
        run: |
          mkdir -p artifacts/admin
          for attempt in $(seq 1 60); do
            if curl -fsS \
              -c artifacts/admin/cookies.txt \
              http://localhost:8080/session/login \
              -o artifacts/admin/login.html; then
              break
            fi
            echo "Waiting for HAYNE Leave (${attempt}/60)..."
            sleep 2
          done

          test -s artifacts/admin/login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/admin/login.html | head -n 1)"
          test -n "$csrf_token"

          curl -fsS -L \
            -c artifacts/admin/cookies.txt \
            -b artifacts/admin/cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=pl' \
            http://localhost:8080/session/login \
            -o artifacts/admin/home.html

          grep -F 'data-hayne-home="v1"' artifacts/admin/home.html

      - name: Smoke all primary authenticated surfaces
        run: |
          set -eu

          routes='home leaves leaves/create leaves/counters calendar/individual requests users users/create users/edit/1 leavetypes leavetypes/create leavetypes/edit/0 leavetypes/edit/1 hr/employees organization contracts contracts/create positions positions/create admin/diagnostic admin/settings'

          for route in $routes; do
            file="artifacts/admin/$(echo "$route" | tr '/' '-').html"
            echo "Checking /$route"
            curl -fsS -L \
              -b artifacts/admin/cookies.txt \
              -c artifacts/admin/cookies.txt \
              "http://localhost:8080/$route" \
              -o "$file"
            test -s "$file"

            if grep -Eqi 'A PHP Error was encountered|Undefined array key|Undefined variable|Severity:[[:space:]]*(Warning|Notice|Deprecated)' "$file"; then
              echo "PHP warning/error rendered by /$route"
              grep -Ein 'A PHP Error was encountered|Undefined array key|Undefined variable|Severity:[[:space:]]*(Warning|Notice|Deprecated)' "$file" || true
              exit 1
            fi
          done

      - name: Verify leave type zero edit contract
        run: |
          edit=artifacts/admin/leavetypes-edit-0.html
          grep -F 'name="id" value="0"' "$edit"
          grep -F 'name="name" id="name" value="compensate"' "$edit"
          grep -F 'name="acronym" id="acronym"' "$edit"
          ! grep -F 'Undefined array key' "$edit"
          ! grep -F 'A PHP Error was encountered' "$edit"

      - name: Verify legacy UI compatibility asset
        run: |
          curl -fsS http://localhost:8080/assets/hayne/legacy-compat.css \
            -o artifacts/admin/legacy-compat.css
          grep -F '#wrap .form-horizontal .control-group' artifacts/admin/legacy-compat.css
          grep -F '#wrap .modal-body form > label' artifacts/admin/legacy-compat.css
          grep -F '#wrap .btn-group' artifacts/admin/legacy-compat.css
          grep -F '#wrap #users td:first-child .pull-right' artifacts/admin/legacy-compat.css

      - name: Capture representative legacy screenshots
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chrome_flags="--headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --run-all-compositor-stages-before-draw --window-size=1440,1000"
            for page in users users-create users-edit-1 hr-employees leavetypes contracts positions admin-settings; do
              source="artifacts/admin/${page}.html"
              if [ -f "$source" ]; then
                google-chrome $chrome_flags \
                  --screenshot="artifacts/admin/${page}.png" \
                  "file://${GITHUB_WORKSPACE}/${source}"
              fi
            done
          fi

      - name: Upload admin compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-admin-01-evidence
          path: artifacts/admin/
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
