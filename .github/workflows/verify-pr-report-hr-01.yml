name: verify-pr-report-hr-01

on:
  pull_request:
    paths:
      - 'hayne/overlay/legacy/application/config/hayne_payroll_codes.php'
      - 'hayne/overlay/legacy/application/models/Hayne_hr_monthly_report_model.php'
      - 'hayne/overlay/legacy/application/controllers/Haynehrreport.php'
      - 'hayne/overlay/legacy/application/views/haynehrreport/monthly.php'
      - 'hayne/patches/295-hr-monthly-report-menu.patch'
      - '.github/workflows/verify-pr-report-hr-01.yml'
      - 'docs/checkpoints/REPORT-HR-01_MONTHLY_HR_EXPORT.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/overlay/legacy/application/config/hayne_payroll_codes.php'
      - 'hayne/overlay/legacy/application/models/Hayne_hr_monthly_report_model.php'
      - 'hayne/overlay/legacy/application/controllers/Haynehrreport.php'
      - 'hayne/overlay/legacy/application/views/haynehrreport/monthly.php'
      - 'hayne/patches/295-hr-monthly-report-menu.patch'
      - '.github/workflows/verify-pr-report-hr-01.yml'
      - 'docs/checkpoints/REPORT-HR-01_MONTHLY_HR_EXPORT.md'

jobs:
  report-hr-01:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Static guards
        shell: bash
        run: |
          set -euo pipefail
          grep -F "where_in('leaves.status', [LMS_ACCEPTED, LMS_CANCELLATION])" hayne/overlay/legacy/application/models/Hayne_hr_monthly_report_model.php
          grep -F "[HAYNE_USAGE_CORRECTION|" hayne/overlay/legacy/application/models/Hayne_hr_monthly_report_model.php
          grep -F "if (!\$this->is_hr && !\$this->is_admin)" hayne/overlay/legacy/application/controllers/Haynehrreport.php
          grep -F "Raport miesięczny dla kadr" hayne/patches/295-hr-monthly-report-menu.patch
          grep -F "'Kod płacowy'" hayne/overlay/legacy/application/controllers/Haynehrreport.php
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('hayne/overlay/legacy/application/config/hayne_payroll_codes.php').read_text(encoding='utf-8')
          entries = re.findall(r"^\s+\d+\s*=>\s*'',?\s*$", text, re.M)
          assert len(entries) == 20, f'expected 20 blank payroll codes, got {len(entries)}'
          PY
          ! grep -Eiq 'care_reason|person_name|household_address|comments|document' hayne/overlay/legacy/application/controllers/Haynehrreport.php hayne/overlay/legacy/application/views/haynehrreport/monthly.php

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Wait for application
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/session/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Lint built REPORT-HR-01 source
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T jorani php -l legacy/application/config/hayne_payroll_codes.php
          docker compose exec -T jorani php -l legacy/application/models/Hayne_hr_monthly_report_model.php
          docker compose exec -T jorani php -l legacy/application/controllers/Haynehrreport.php
          docker compose exec -T jorani php -l legacy/application/views/haynehrreport/monthly.php
          docker compose exec -T jorani php -l legacy/application/views/menu/index.php
          docker compose exec -T jorani php -r 'require "legacy/vendor/autoload.php"; exit(class_exists("PhpOffice\\PhpSpreadsheet\\Spreadsheet") ? 0 : 1);'
          docker compose exec -T jorani grep -F 'haynehrreport/monthly' legacy/application/views/menu/index.php

      - name: Seed deterministic monthly report fixtures
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE"' <<'SQL'
          SET @employee = 2;
          SET @contract = (SELECT contract FROM users WHERE id = @employee);
          DELETE FROM dayoffs WHERE contract = @contract AND date IN ('2030-07-06', '2030-07-07');
          INSERT INTO dayoffs(contract, date, type, title) VALUES
            (@contract, '2030-07-06', 1, 'CI REPORT DAY OFF'),
            (@contract, '2030-07-07', 1, 'CI REPORT DAY OFF');

          INSERT INTO leaves(startdate, startdatetype, enddate, enddatetype, duration, type, cause, status, employee)
          VALUES('2030-07-01', 'Morning', '2030-07-08', 'Afternoon', 8, 1, 'CI REPORT ACCEPTED', 2, @employee);
          SET @accepted = LAST_INSERT_ID();
          INSERT INTO leaves_history SELECT *, NULL, 1, 2, '2030-06-20 09:15:00' FROM leaves WHERE id = @accepted;
          UPDATE leaves SET status = 3 WHERE id = @accepted;
          INSERT INTO leaves_history SELECT *, NULL, 2, 1, '2030-06-20 10:02:00' FROM leaves WHERE id = @accepted;

          INSERT INTO leaves(startdate, startdatetype, enddate, enddatetype, duration, type, cause, status, employee)
          VALUES('2030-07-30', 'Morning', '2030-08-04', 'Afternoon', 6, 1, 'CI REPORT CANCELLATION', 2, @employee);
          SET @cancellation = LAST_INSERT_ID();
          INSERT INTO leaves_history SELECT *, NULL, 1, 2, '2030-06-22 09:00:00' FROM leaves WHERE id = @cancellation;
          UPDATE leaves SET status = 3 WHERE id = @cancellation;
          INSERT INTO leaves_history SELECT *, NULL, 2, 1, '2030-06-22 10:00:00' FROM leaves WHERE id = @cancellation;
          UPDATE leaves SET status = 5 WHERE id = @cancellation;
          INSERT INTO leaves_history SELECT *, NULL, 2, 2, '2030-07-20 12:00:00' FROM leaves WHERE id = @cancellation;

          INSERT INTO leaves(startdate, startdatetype, enddate, enddatetype, duration, type, cause, status, employee)
          VALUES('2030-07-10', 'Morning', '2030-07-10', 'Afternoon', 1, 1, 'CI REPORT CANCELED', 6, @employee);

          INSERT INTO leaves(startdate, startdatetype, enddate, enddatetype, duration, type, cause, status, employee)
          VALUES('2030-07-11', 'Morning', '2030-07-11', 'Afternoon', 1, 1, '[HAYNE_USAGE_CORRECTION|CI]', 3, @employee);

          INSERT INTO leaves(startdate, startdatetype, enddate, enddatetype, duration, type, cause, status, employee)
          VALUES('2030-07-12', 'Morning', '2030-07-12', 'Afternoon', 1, 1, 'CI REPORT REQUESTED', 2, @employee);
          SQL

      - name: Authenticate as HR administrator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl -fsS -c artifacts/hr-cookies.txt http://localhost:8080/session/login -o artifacts/hr-login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/hr-login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/hr-cookies.txt \
            -b artifacts/hr-cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            http://localhost:8080/session/login \
            -o artifacts/hr-home.html
          grep -F 'Cześć Admin!' artifacts/hr-home.html

      - name: Verify effective monthly preview and audit
        shell: bash
        run: |
          set -euo pipefail
          accepted_id="$(docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT id FROM leaves WHERE cause=\"CI REPORT ACCEPTED\" LIMIT 1"')"
          cancellation_id="$(docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT id FROM leaves WHERE cause=\"CI REPORT CANCELLATION\" LIMIT 1"')"
          canceled_id="$(docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT id FROM leaves WHERE cause=\"CI REPORT CANCELED\" LIMIT 1"')"
          correction_id="$(docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT id FROM leaves WHERE cause LIKE \"[HAYNE_USAGE_CORRECTION|CI]%\" LIMIT 1"')"
          requested_id="$(docker compose exec -T mysql sh -ec 'mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -Nse "SELECT id FROM leaves WHERE cause=\"CI REPORT REQUESTED\" LIMIT 1"')"
          curl -fsS -b artifacts/hr-cookies.txt \
            'http://localhost:8080/haynehrreport/monthly?period=2030-07' \
            -o artifacts/report.html
          ACCEPTED_ID="$accepted_id" CANCELLATION_ID="$cancellation_id" CANCELED_ID="$canceled_id" CORRECTION_ID="$correction_id" REQUESTED_ID="$requested_id" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          html = Path('artifacts/report.html').read_text(encoding='utf-8')
          def row(leave_id):
              match = re.search(r'<tr data-leave-id="%s">(.*?)</tr>' % re.escape(leave_id), html, re.S)
              assert match, f'missing row {leave_id}'
              return re.sub(r'<[^>]+>', '|', match.group(1))

          accepted = row(os.environ['ACCEPTED_ID'])
          assert '|6|' in accepted
          assert 'Zaakceptowany' in accepted
          assert '2030-06-20 09:15:00' in accepted
          assert 'Admin' in accepted
          assert '2030-06-20 10:02:00' in accepted

          cancellation = row(os.environ['CANCELLATION_ID'])
          assert '|2|' in cancellation
          assert 'Anulowanie w toku' in cancellation
          assert 'W toku' in cancellation

          for excluded in ('CANCELED_ID', 'CORRECTION_ID', 'REQUESTED_ID'):
              assert f'data-leave-id="{os.environ[excluded]}"' not in html
          assert 'CI REPORT ACCEPTED' not in html
          assert '[HAYNE_USAGE_CORRECTION|' not in html
          PY

      - name: Verify CSV contract and privacy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -b artifacts/hr-cookies.txt \
            'http://localhost:8080/haynehrreport/csv?period=2030-07' \
            -o artifacts/report.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          expected = [
              'ID wniosku', 'Pracownik', 'Dział', 'Rodzaj nieobecności', 'Od', 'Do',
              'Dni robocze w miesiącu', 'Godziny w miesiącu', 'Status', 'Data złożenia',
              'Zatwierdził', 'Data decyzji', 'Anulowanie', 'Kod płacowy'
          ]
          text = Path('artifacts/report.csv').read_text(encoding='utf-8-sig')
          rows = list(csv.reader(text.splitlines(), delimiter=';'))
          assert rows[0] == expected
          assert len(rows) == 3
          assert all(len(row) == 14 for row in rows)
          assert all(row[7] == '0' for row in rows[1:])
          assert all(row[13] == '' for row in rows[1:])
          assert 'CI REPORT' not in text
          assert 'HAYNE_USAGE_CORRECTION' not in text
          PY

      - name: Verify XLSX contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -b artifacts/hr-cookies.txt \
            'http://localhost:8080/haynehrreport/xlsx?period=2030-07' \
            -o artifacts/report.xlsx
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          path = Path('artifacts/report.xlsx')
          assert path.read_bytes()[:2] == b'PK'
          with zipfile.ZipFile(path) as zf:
              xml = '\n'.join(
                  zf.read(name).decode('utf-8', errors='ignore')
                  for name in zf.namelist()
                  if name.endswith('.xml')
              )
          for value in (
              'HAYNE Leave — raport miesięczny dla kadr',
              'ID wniosku',
              'Dni robocze w miesiącu',
              'Kod płacowy',
              '2030-07',
          ):
              assert value in xml
          assert 'CI REPORT ACCEPTED' not in xml
          assert 'HAYNE_USAGE_CORRECTION' not in xml
          PY

      - name: Ordinary employee is forbidden
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -c artifacts/user-cookies.txt http://localhost:8080/session/login -o artifacts/user-login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/user-login.html | head -n 1)"
          test -n "$csrf_token"
          curl -fsS -L \
            -c artifacts/user-cookies.txt \
            -b artifacts/user-cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jdoe' \
            --data-urlencode 'password=jdoe' \
            --data-urlencode 'language=en' \
            http://localhost:8080/session/login \
            -o artifacts/user-home.html
          status="$(curl -sS -o artifacts/user-report.html -w '%{http_code}' -b artifacts/user-cookies.txt 'http://localhost:8080/haynehrreport/monthly?period=2030-07')"
          test "$status" = '403'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
