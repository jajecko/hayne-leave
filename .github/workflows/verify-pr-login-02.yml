name: verify-pr-login-02

on:
  pull_request:
    paths:
      - 'hayne/patches/180-default-dashboard-route.patch'
      - '.github/workflows/verify-pr-login-02.yml'
      - 'docs/checkpoints/PR-LOGIN-02_DEFAULT_DASHBOARD.md'
  push:
    branches:
      - main
    paths:
      - 'hayne/patches/180-default-dashboard-route.patch'
      - '.github/workflows/verify-pr-login-02.yml'
      - 'docs/checkpoints/PR-LOGIN-02_DEFAULT_DASHBOARD.md'

jobs:
  default-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Guard route patch
        run: |
          grep -F "default_controller'] = 'pages/view/home'" hayne/patches/180-default-dashboard-route.patch
          ! grep -F "+\$route['default_controller'] = 'leaves';" hayne/patches/180-default-dashboard-route.patch

      - name: Build and start HAYNE Leave
        run: docker compose up --build -d

      - name: Guard built route
        run: |
          docker compose exec -T jorani sh -ec '
            grep -F "\$route['\''default_controller'\''] = '\''pages/view/home'\'';" legacy/application/config/routes.php
          '

      - name: Verify bare root login lands on dashboard
        run: |
          mkdir -p artifacts/login-02
          for attempt in $(seq 1 60); do
            if curl -fsS -L \
              -c artifacts/login-02/root-cookies.txt \
              -b artifacts/login-02/root-cookies.txt \
              http://localhost:8080/ \
              -o artifacts/login-02/root-login.html; then
              break
            fi
            echo "Waiting for HAYNE Leave (${attempt}/60)..."
            sleep 2
          done

          grep -F 'hayne-logo--login' artifacts/login-02/root-login.html
          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/login-02/root-login.html | head -n 1)"
          test -n "$csrf_token"

          curl -fsS -L \
            -c artifacts/login-02/root-cookies.txt \
            -b artifacts/login-02/root-cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            -w '%{url_effective}\n' \
            http://localhost:8080/session/login \
            -o artifacts/login-02/root-after-login.html \
            | tee artifacts/login-02/root-effective-url.txt

          grep -F 'data-hayne-home="v1"' artifacts/login-02/root-after-login.html
          grep -F 'Cześć Admin!' artifacts/login-02/root-after-login.html
          ! grep -F 'id="leaves"' artifacts/login-02/root-after-login.html

      - name: Preserve explicit protected deep link
        run: |
          curl -fsS -L \
            -c artifacts/login-02/deep-cookies.txt \
            -b artifacts/login-02/deep-cookies.txt \
            http://localhost:8080/leaves/counters \
            -o artifacts/login-02/deep-login.html

          csrf_token="$(sed -n 's/.*name="csrf_test_jorani" value="\([^"]*\)".*/\1/p' artifacts/login-02/deep-login.html | head -n 1)"
          test -n "$csrf_token"

          curl -fsS -L \
            -c artifacts/login-02/deep-cookies.txt \
            -b artifacts/login-02/deep-cookies.txt \
            --data-urlencode "csrf_test_jorani=${csrf_token}" \
            --data-urlencode 'login=jorani' \
            --data-urlencode 'password=jorani' \
            --data-urlencode 'language=en' \
            -w '%{url_effective}\n' \
            http://localhost:8080/session/login \
            -o artifacts/login-02/deep-after-login.html \
            | tee artifacts/login-02/deep-effective-url.txt

          grep -F 'data-hayne-view="leave-balance-v1"' artifacts/login-02/deep-after-login.html
          grep -F '/leaves/counters' artifacts/login-02/deep-effective-url.txt

      - name: Upload routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-login-02-evidence
          path: artifacts/login-02/
          if-no-files-found: warn
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
