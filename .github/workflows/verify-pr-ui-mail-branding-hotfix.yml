name: verify-pr-ui-mail-branding-hotfix

on:
  pull_request:
    paths:
      - 'hayne/patches/286-ui-mail-branding-hotfix.patch'
      - 'hayne/overlay/assets/hayne/ui-mail-hotfix.css'
      - 'hayne/overlay/legacy/application/helpers/hayne_mail_helper.php'
      - '.github/workflows/verify-pr-ui-mail-branding-hotfix.yml'
      - 'docs/checkpoints/UI-MAIL-HOTFIX_REVIEW_ALERT_INLINE_LOGO.md'

jobs:
  verify-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tracked hotfix contract
        run: |
          set -eux
          PATCH=hayne/patches/286-ui-mail-branding-hotfix.patch
          CSS=hayne/overlay/assets/hayne/ui-mail-hotfix.css
          MAIL=hayne/overlay/legacy/application/helpers/hayne_mail_helper.php

          test -s "$PATCH"
          test -s "$CSS"
          test -s "$MAIL"

          grep -F 'assets/hayne/ui-mail-hotfix.css?v=1' "$PATCH"
          grep -F '<!--HAYNE_MAIL_LOGO-->' "$PATCH"
          grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png', 'image/png')" "$PATCH"
          grep -F 'attachment_cid($mailLogoPath)' "$PATCH"
          grep -F 'HAYNE mail inline logo failed' "$PATCH"

          grep -F '#wrap .alert .close {' "$CSS"
          grep -F 'right: 12px;' "$CSS"
          grep -F 'background: #fff;' "$CSS"
          grep -F '#wrap .hayne-approval-review a.hayne-approval-review__action--accept' "$CSS"
          grep -F 'color: #fff;' "$CSS"

          grep -F '<!--HAYNE_MAIL_LOGO-->' "$MAIL"
          grep -F 'HAYNE LEAVE' "$MAIL"

      - name: Verify patch 286 independently against pinned upstream
        run: |
          set -eux
          mkdir -p /tmp/jorani
          curl -fsSL https://github.com/jorani/jorani/archive/refs/tags/v1.0.4.tar.gz \
            | tar -xz --strip-components=1 -C /tmp/jorani
          cd /tmp/jorani
          patch --dry-run --batch --forward -p1 < "$GITHUB_WORKSPACE/hayne/patches/286-ui-mail-branding-hotfix.patch"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify final runtime contract
        run: |
          set -eux
          IMAGE="$(docker compose images -q jorani)"
          test -n "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            require_grep() {
              pattern="$1"
              file="$2"
              label="$3"
              if ! grep -F "$pattern" "$file" >/dev/null; then
                echo "::error title=UI mail runtime contract::$label"
                echo "Missing pattern: $pattern"
                echo "Runtime file: $file"
                exit 1
              fi
            }

            require_file() {
              file="$1"
              label="$2"
              if [ ! -s "$file" ]; then
                echo "::error title=UI mail runtime contract::$label"
                echo "Missing or empty runtime file: $file"
                exit 1
              fi
            }

            require_php_lint() {
              file="$1"
              label="$2"
              if ! php -l "$file"; then
                echo "::error title=UI mail runtime contract::$label"
                exit 1
              fi
            }

            require_php_lint /var/www/html/legacy/application/helpers/hayne_mail_helper.php "hayne_mail_helper PHP lint failed"
            require_php_lint /var/www/html/legacy/application/helpers/tools_helper.php "tools_helper PHP lint failed"

            require_grep "assets/hayne/ui-mail-hotfix.css?v=1" /var/www/html/legacy/application/views/templates/header.php "late UI stylesheet is not loaded"
            require_file /var/www/html/assets/hayne/ui-mail-hotfix.css "late UI stylesheet is missing"
            require_grep "#wrap .alert .close {" /var/www/html/assets/hayne/ui-mail-hotfix.css "alert close-button selector is missing"
            require_grep "right: 12px;" /var/www/html/assets/hayne/ui-mail-hotfix.css "alert close-button right offset is missing"
            require_grep "background: #fff;" /var/www/html/assets/hayne/ui-mail-hotfix.css "alert white background override is missing"
            require_grep "#wrap .hayne-approval-review a.hayne-approval-review__action--accept" /var/www/html/assets/hayne/ui-mail-hotfix.css "approval accept selector is missing"
            require_grep "color: #fff;" /var/www/html/assets/hayne/ui-mail-hotfix.css "approval accept white text override is missing"

            require_grep "<!--HAYNE_MAIL_LOGO-->" /var/www/html/legacy/application/helpers/hayne_mail_helper.php "mail logo placeholder is missing"
            require_grep "HAYNE LEAVE" /var/www/html/legacy/application/helpers/hayne_mail_helper.php "mail branding compatibility marker is missing"
            require_grep "assets/hayne/logo.png" /var/www/html/legacy/application/helpers/tools_helper.php "inline logo source path is missing"
            require_grep "attachment_cid(\$mailLogoPath)" /var/www/html/legacy/application/helpers/tools_helper.php "inline logo CID generation is missing"
            require_grep "<img src=\"cid:" /var/www/html/legacy/application/helpers/tools_helper.php "CID image markup is missing"
            require_grep "HAYNE mail inline logo failed" /var/www/html/legacy/application/helpers/tools_helper.php "inline logo fallback logging is missing"

            require_grep "function attach(" /var/www/html/legacy/system/libraries/Email.php "CodeIgniter inline attachment API is missing"
            require_grep "function attachment_cid(" /var/www/html/legacy/system/libraries/Email.php "CodeIgniter CID API is missing"
            require_file /var/www/html/assets/hayne/logo.png "approved logo file is missing from runtime image"
          '

      - name: Verify exact logo bytes survive build
        run: |
          set -eux
          IMAGE="$(docker compose images -q jorani)"
          SOURCE_LOGO_SHA="$(sha256sum hayne/overlay/assets/hayne/logo.png | awk '{print $1}')"
          IMAGE_LOGO_SHA="$(docker run --rm --entrypoint sha256sum "$IMAGE" /var/www/html/assets/hayne/logo.png | awk '{print $1}')"
          echo "SOURCE_LOGO_SHA=$SOURCE_LOGO_SHA"
          echo "IMAGE_LOGO_SHA=$IMAGE_LOGO_SHA"
          test "$SOURCE_LOGO_SHA" = "$IMAGE_LOGO_SHA"

      - name: Verify no absence-policy scope drift
        run: |
          set -eux
          ! grep -E '^--- a/(legacy/application/models/Hayne_leave_(type_registry|workflow)_model\.php|hayne/sql/)' hayne/patches/286-ui-mail-branding-hotfix.patch
          ! grep -F 'hayne_leave_type_registry' hayne/patches/286-ui-mail-branding-hotfix.patch

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
