name: verify-pr-ui-mail-branding-hotfix

on:
  pull_request:
    paths:
      - 'hayne/patches/286-ui-mail-branding-hotfix.patch'
      - 'hayne/overlay/assets/hayne/ui-mail-hotfix.css'
      - 'hayne/overlay/legacy/application/helpers/hayne_mail_helper.php'
      - '.github/workflows/verify-pr-ui-mail-branding-hotfix.yml'
      - 'docs/checkpoints/UI-MAIL-HOTFIX_REVIEW_ALERT_INLINE_LOGO.md'

jobs:
  verify-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tracked hotfix contract
        run: |
          set -eux
          PATCH=hayne/patches/286-ui-mail-branding-hotfix.patch
          CSS=hayne/overlay/assets/hayne/ui-mail-hotfix.css
          MAIL=hayne/overlay/legacy/application/helpers/hayne_mail_helper.php

          test -s "$PATCH"
          test -s "$CSS"
          test -s "$MAIL"

          grep -F 'assets/hayne/ui-mail-hotfix.css?v=1' "$PATCH"
          grep -F '<!--HAYNE_MAIL_LOGO-->' "$PATCH"
          grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png')" "$PATCH"
          ! grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png', 'image/png')" "$PATCH"
          grep -F 'attachment_cid($mailLogoPath)' "$PATCH"
          grep -F 'HAYNE mail inline logo failed' "$PATCH"

          grep -F '#wrap .alert .close {' "$CSS"
          grep -F 'right: 12px;' "$CSS"
          grep -F 'background: #fff;' "$CSS"
          grep -F '#wrap .hayne-approval-review a.hayne-approval-review__action--accept' "$CSS"
          grep -F 'color: #fff;' "$CSS"

          grep -F '<!--HAYNE_MAIL_LOGO-->' "$MAIL"
          grep -F 'HAYNE LEAVE' "$MAIL"

      - name: Verify patch 286 independently against pinned upstream
        run: |
          set -eux
          mkdir -p /tmp/jorani
          curl -fsSL https://github.com/jorani/jorani/archive/refs/tags/v1.0.4.tar.gz \
            | tar -xz --strip-components=1 -C /tmp/jorani
          cd /tmp/jorani
          patch --dry-run --batch --forward -p1 < "$GITHUB_WORKSPACE/hayne/patches/286-ui-mail-branding-hotfix.patch"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify exact mail helper bytes survive build
        run: |
          set -eux
          SOURCE_SHA="$(sha256sum hayne/overlay/legacy/application/helpers/hayne_mail_helper.php | awk '{print $1}')"
          IMAGE_SHA="$(docker compose run --rm --no-deps --entrypoint sha256sum jorani /var/www/html/legacy/application/helpers/hayne_mail_helper.php | awk '{print $1}')"
          echo "SOURCE_MAIL_HELPER_SHA=$SOURCE_SHA"
          echo "IMAGE_MAIL_HELPER_SHA=$IMAGE_SHA"
          test "$SOURCE_SHA" = "$IMAGE_SHA"

      - name: Lint final HAYNE mail helper with PHP core only
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint php jorani -n -l /var/www/html/legacy/application/helpers/hayne_mail_helper.php

      - name: Lint final Jorani tools helper with PHP core only
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint php jorani -n -l /var/www/html/legacy/application/helpers/tools_helper.php

      - name: Verify final UI runtime contract
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint sh jorani -ec '
            grep -F "assets/hayne/ui-mail-hotfix.css?v=1" /var/www/html/legacy/application/views/templates/header.php
            test -s /var/www/html/assets/hayne/ui-mail-hotfix.css
            grep -F "#wrap .alert .close {" /var/www/html/assets/hayne/ui-mail-hotfix.css
            grep -F "right: 12px;" /var/www/html/assets/hayne/ui-mail-hotfix.css
            grep -F "background: #fff;" /var/www/html/assets/hayne/ui-mail-hotfix.css
            grep -F "#wrap .hayne-approval-review a.hayne-approval-review__action--accept" /var/www/html/assets/hayne/ui-mail-hotfix.css
            grep -F "color: #fff;" /var/www/html/assets/hayne/ui-mail-hotfix.css
          '

      - name: Verify final mail token contract
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint sh jorani -ec '
            grep -F "<!--HAYNE_MAIL_LOGO-->" /var/www/html/legacy/application/helpers/hayne_mail_helper.php
            grep -F "HAYNE LEAVE" /var/www/html/legacy/application/helpers/hayne_mail_helper.php
          '

      - name: Verify final CID wrapper contract
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint sh jorani -ec '
            grep -F "assets/hayne/logo.png" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "attach(\$mailLogoPath, '\''inline'\'', '\''hayne-logo.png'\'')" /var/www/html/legacy/application/helpers/tools_helper.php
            ! grep -F "attach(\$mailLogoPath, '\''inline'\'', '\''hayne-logo.png'\'', '\''image/png'\'')" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "attachment_cid(\$mailLogoPath)" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "<img src=\"cid:" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "HAYNE mail inline logo failed" /var/www/html/legacy/application/helpers/tools_helper.php
          '

      - name: Verify CodeIgniter CID API
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint sh jorani -ec '
            grep -F "function attach(" /var/www/html/legacy/system/libraries/Email.php
            grep -F "function attachment_cid(" /var/www/html/legacy/system/libraries/Email.php
          '

      - name: Verify inline attachment contains real PNG bytes
        run: |
          set -eux
          docker compose run --rm --no-deps -T --entrypoint php jorani -n <<'PHP'
          <?php
          define('BASEPATH', '/var/www/html/legacy/system/');

          function &get_mimes()
          {
              static $mimes = ['png' => 'image/png'];
              return $mimes;
          }

          require BASEPATH . 'libraries/Email.php';

          $reflection = new ReflectionClass('CI_Email');
          $email = $reflection->newInstanceWithoutConstructor();
          $path = '/var/www/html/assets/hayne/logo.png';

          if ($email->attach($path, 'inline', 'hayne-logo.png') === false) {
              fwrite(STDERR, "attach failed\n");
              exit(10);
          }

          $cid = $email->attachment_cid($path);
          if (!is_string($cid) || $cid === '') {
              fwrite(STDERR, "CID missing\n");
              exit(11);
          }

          $attachmentsProperty = $reflection->getProperty('_attachments');
          $attachmentsProperty->setAccessible(true);
          $attachments = $attachmentsProperty->getValue($email);

          if (!is_array($attachments) || count($attachments) !== 1) {
              fwrite(STDERR, "unexpected attachment count\n");
              exit(12);
          }

          $attachment = $attachments[0];
          $payload = base64_decode(preg_replace('/\s+/', '', $attachment['content']), true);
          if (!is_string($payload)) {
              fwrite(STDERR, "attachment payload is not valid base64\n");
              exit(13);
          }

          $expectedSha = hash_file('sha256', $path);
          $actualSha = hash('sha256', $payload);
          echo "EXPECTED_PNG_SHA={$expectedSha}\n";
          echo "ATTACHMENT_PNG_SHA={$actualSha}\n";

          if ($actualSha !== $expectedSha) {
              fwrite(STDERR, "inline attachment bytes differ from logo.png\n");
              exit(14);
          }

          if (($attachment['type'] ?? '') !== 'image/png') {
              fwrite(STDERR, "unexpected MIME type\n");
              exit(15);
          }

          if (($attachment['multipart'] ?? '') !== 'related') {
              fwrite(STDERR, "attachment is not multipart/related\n");
              exit(16);
          }

          if (($attachment['cid'] ?? '') !== $cid) {
              fwrite(STDERR, "attachment CID mismatch\n");
              exit(17);
          }

          echo "REAL_PNG_CID_GATE=PASS\n";
          PHP

      - name: Verify tracked logo exists in runtime image
        run: |
          set -eux
          docker compose run --rm --no-deps --entrypoint test jorani -s /var/www/html/assets/hayne/logo.png

      - name: Verify exact logo bytes survive build
        run: |
          set -eux
          SOURCE_LOGO_SHA="$(sha256sum hayne/overlay/assets/hayne/logo.png | awk '{print $1}')"
          IMAGE_LOGO_SHA="$(docker compose run --rm --no-deps --entrypoint sha256sum jorani /var/www/html/assets/hayne/logo.png | awk '{print $1}')"
          echo "SOURCE_LOGO_SHA=$SOURCE_LOGO_SHA"
          echo "IMAGE_LOGO_SHA=$IMAGE_LOGO_SHA"
          test "$SOURCE_LOGO_SHA" = "$IMAGE_LOGO_SHA"

      - name: Verify no absence-policy scope drift
        run: |
          set -eux
          ! grep -E '^--- a/(legacy/application/models/Hayne_leave_(type_registry|workflow)_model\.php|hayne/sql/)' hayne/patches/286-ui-mail-branding-hotfix.patch
          ! grep -F 'hayne_leave_type_registry' hayne/patches/286-ui-mail-branding-hotfix.patch

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
