name: verify-pr-ui-mail-branding-hotfix

on:
  pull_request:
    paths:
      - 'hayne/patches/286-ui-mail-branding-hotfix.patch'
      - '.github/workflows/verify-pr-ui-mail-branding-hotfix.yml'
      - 'docs/checkpoints/UI-MAIL-HOTFIX_REVIEW_ALERT_INLINE_LOGO.md'

jobs:
  verify-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify patch contract
        run: |
          set -eux
          PATCH=hayne/patches/286-ui-mail-branding-hotfix.patch
          test -s "$PATCH"
          grep -F '#wrap .alert .close {' "$PATCH"
          grep -F 'right: 12px;' "$PATCH"
          grep -F 'background: #fff;' "$PATCH"
          grep -F '#wrap .hayne-approval-review a.hayne-approval-review__action--accept' "$PATCH"
          grep -F '<!--HAYNE_MAIL_LOGO-->' "$PATCH"
          grep -F "attach(\$mailLogoPath, 'inline', 'hayne-logo.png', 'image/png')" "$PATCH"
          grep -F 'attachment_cid($mailLogoPath)' "$PATCH"
          grep -F 'HAYNE mail inline logo failed' "$PATCH"

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build final HAYNE Leave image
        run: docker compose build jorani

      - name: Verify final runtime contract
        run: |
          set -eux
          IMAGE="$(docker compose images -q jorani)"
          test -n "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -ec '
            php -l /var/www/html/legacy/application/helpers/hayne_mail_helper.php
            php -l /var/www/html/legacy/application/helpers/tools_helper.php

            grep -F "#wrap .alert .close {" /var/www/html/assets/hayne/app.css
            grep -F "right: 12px;" /var/www/html/assets/hayne/app.css
            grep -F "background: #fff;" /var/www/html/assets/hayne/app.css
            grep -F "#wrap .hayne-approval-review a.hayne-approval-review__action--accept" /var/www/html/assets/hayne/approval-review-privacy.css
            grep -F "color: #fff;" /var/www/html/assets/hayne/approval-review-privacy.css

            grep -F "<!--HAYNE_MAIL_LOGO-->" /var/www/html/legacy/application/helpers/hayne_mail_helper.php
            grep -F "assets/hayne/logo.png" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "attachment_cid(\$mailLogoPath)" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "<img src=\"cid:" /var/www/html/legacy/application/helpers/tools_helper.php
            grep -F "HAYNE mail inline logo failed" /var/www/html/legacy/application/helpers/tools_helper.php

            grep -F "function attach(" /var/www/html/legacy/system/libraries/Email.php
            grep -F "function attachment_cid(" /var/www/html/legacy/system/libraries/Email.php
            test -s /var/www/html/assets/hayne/logo.png
          '

      - name: Verify exact logo bytes survive build
        run: |
          set -eux
          IMAGE="$(docker compose images -q jorani)"
          SOURCE_LOGO_SHA="$(sha256sum hayne/overlay/assets/hayne/logo.png | awk '{print $1}')"
          IMAGE_LOGO_SHA="$(docker run --rm --entrypoint sha256sum "$IMAGE" /var/www/html/assets/hayne/logo.png | awk '{print $1}')"
          echo "SOURCE_LOGO_SHA=$SOURCE_LOGO_SHA"
          echo "IMAGE_LOGO_SHA=$IMAGE_LOGO_SHA"
          test "$SOURCE_LOGO_SHA" = "$IMAGE_LOGO_SHA"

      - name: Verify no absence-policy scope drift
        run: |
          set -eux
          ! grep -E '^--- a/(legacy/application/models/Hayne_leave_(type_registry|workflow)_model\.php|hayne/sql/)' hayne/patches/286-ui-mail-branding-hotfix.patch
          ! grep -F 'hayne_leave_type_registry' hayne/patches/286-ui-mail-branding-hotfix.patch

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
