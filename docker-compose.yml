services:
  jorani:
    build:
      context: .
      args:
        JORANI_VERSION: ${JORANI_VERSION:-v1.0.4}
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - ${LDAP_CA_HOST_DIR:-./certs}:/opt/hayne/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
      args:
        JORANI_VERSION: ${JORANI_VERSION:-v1.0.4}
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql_data:
